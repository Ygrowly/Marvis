name: Check build freshness（落盘即上站）

# PLAN v2 治理律 1 的机器执行：md 正本改了、site/ 派生物没重新生成 → 本检查红。
# 本地修法恒为一条：python site/build.py 后重新提交。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild site from md sources
        run: python site/build.py

      - name: Assert site/ matches committed artifacts
        run: |
          if [ -n "$(git status --porcelain site/)" ]; then
            echo "::error::site/ 与 md 正本不同步——本地跑 python site/build.py 后再提交"
            git status --porcelain site/
            python3 site/_tests/_byte_diff.py
            exit 1
          fi

      - name: Regression suites（七套件）
        run: |
          for t in test_dispatch test_progression test_render test_sync test_brain test_insight; do
            node "site/_tests/$t.js"
          done
          python site/_tests/test_ledger.py

      # 可复现性回归：这台runner 是 Linux，本地是 Windows，两边都跑才算数。
      # 排Path 对象的大小写敏感性差异只在这类跨平台检查里才暴露得出来
      # （2026-10-07 修的就是它：本地重跑多少次都对，只有 CI 红）。
      - name: Build determinism（跨平台键序确定）
        run: python site/_tests/test_determinism.py
