name: Check build freshness（落盘即上站）

# PLAN v2 治理律 1 的机器执行：md 正本改了、site/ 派生物没重新生成 → 本检查红。
# 本地修法恒为一条：python site/build.py 后重新提交。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild site from md sources
        run: python site/build.py

      - name: Assert site/ matches committed artifacts
        run: |
          if [ -n "$(git status --porcelain site/)" ]; then
            echo "::error::site/ 与 md 正本不同步——本地跑 python site/build.py 后再提交"
            git status --porcelain site/
            python3 - <<'PYEOF'
import subprocess
old = subprocess.run(['git','show','HEAD:site/_data/breaks.js'],capture_output=True).stdout
new = open('site/_data/breaks.js','rb').read()
print('len old', len(old), 'new', len(new))
for i,(a,b) in enumerate(zip(old,new)):
    if a!=b:
        print('first diff at byte', i)
        print('OLD:', repr(old[max(0,i-60):i+60]))
        print('NEW:', repr(new[max(0,i-60):i+60]))
        break
else:
    print('common prefix identical, tail-only diff')
PYEOF
            exit 1
          fi

      - name: Regression suites（七套件）
        run: |
          for t in test_dispatch test_progression test_render test_sync test_brain test_insight; do
            node "site/_tests/$t.js"
          done
          python site/_tests/test_ledger.py
