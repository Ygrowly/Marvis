<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的书架 · 第二大脑</title>
<link rel="stylesheet" href="_components/marvis.css">
<style>
  #stage { position: relative; width: 100%; height: 580px; border-radius: 12px; overflow: hidden;
    background: #f3efe7; border: 1px solid rgba(0,0,0,.10); margin: 14px 0 10px; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #cv { display: block; width: 100%; height: 100%; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl { position: absolute; font-size: 11px; line-height: 1.15; padding: 1px 6px; border-radius: 5px;
    background: rgba(255,255,255,.9); border: 1px solid rgba(0,0,0,.12); white-space: nowrap;
    transform: translate(-50%,-50%); color: #2C2C2A; pointer-events: auto; cursor: pointer; }
  .lbl.hot { background: #fff; border-color: rgba(0,0,0,.45); font-weight: 500; z-index: 5; }
  .hall-lbl { font-size: 12px; font-weight: 500; background: #fff; border-color: rgba(0,0,0,.25);
    padding: 2px 8px; }
  .hall-lbl b { font-weight: 500; }
  .hall-lbl i { font-style: normal; color: #5F5E5A; font-size: 11px; margin-left: 4px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #5F5E5A; margin: 0 0 10px; }
  .legend span.k { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  #panel { border: 1px solid rgba(0,0,0,.12); border-radius: 12px; padding: 14px 16px; background: #fff; margin-top: 10px; min-height: 96px; }
  #panel h3 { margin: 0 0 6px; font-size: 15px; font-weight: 500; }
  #panel .meta { font-size: 12px; color: #5F5E5A; margin-bottom: 6px; line-height: 1.5; }
  #panel ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  #panel li { margin: 3px 0; }
  .bars { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 0; }
  .bar { flex: 1 1 140px; border: 1px solid rgba(0,0,0,.10); border-radius: 10px; padding: 8px 10px; background: #fff; }
  .bar small { display: block; color: #5F5E5A; font-size: 11px; }
  .bar strong { font-size: 18px; font-weight: 500; }
  .track { height: 6px; border-radius: 4px; background: rgba(0,0,0,.07); margin-top: 6px; overflow: hidden; }
  .track i { display: block; height: 100%; }
  .fallback { display: grid; grid-template-columns: repeat(auto-fill,minmax(190px,1fr)); gap: 10px; margin-top: 10px; }
  .fb-hall { border: 1px solid rgba(0,0,0,.12); border-radius: 10px; padding: 10px 12px; background: #fff; }
  .fb-hall h4 { margin: 0 0 6px; font-size: 13px; font-weight: 500; }
  .fb-hall a { display: block; font-size: 12px; margin: 2px 0; color: #185FA5; text-decoration: none; }
</style>
</head>
<body class="mv-page">
<div class="mv-wrap">

  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <h1 class="mv-h1" style="margin:0">我的书架</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="mv-btn" href="index.html" style="text-decoration:none">回今日</a>
      <a class="mv-btn mv-btn-primary" href="progress.html" style="text-decoration:none">进度与作业</a>
    </div>
  </div>
  <p class="mv-sub" style="margin-bottom:8px">
    第二大脑，做成一面书架。<b>五个区就是五个方向，一本书就是一个模块或一条准则</b>，名字印在书脊上。
    <b>书越厚、颜色越实 = 练得越透</b>；灰而薄的是还没读进去的部分，空着的架子是还没长出来的部分。
    拖拽小幅转视角，滚轮缩放，点书看明细。
  </p>

  <div class="legend" id="legend"></div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
  </div>

  <div class="bars" id="bars"></div>

  <div id="panel">
    <h3>点任意一本书</h3>
    <div class="meta">这里显示它的明细、掌握度和下钻入口。点顶部铭牌看整体。</div>
  </div>

  <p class="mv-note" style="margin-top:18px">
    书的厚薄和颜色只由进度页的闭卷自评推进，这里不手写。<b>操作系统、战场、书架三个区现在全是灰薄册</b>——
    正本都写完了，但还没接进派单，所以没有复训数据。这就是「读完只剩个概念」的那一环。
  </p>

</div>

<script src="_build/three/three.min.js"></script>
<script src="_data/clusters.js"></script>
<script src="_data/projects.js"></script>
<script src="_data/rules.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'mv.progress.v1', MASTER = 1;
  var S = null;
  try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { S = null; }
  function lvOf(k) { return (S && S.lv && S.lv[k] && S.lv[k].l) || 0; }
  function ob(p) { return 'obsidian://open?vault=Marvis&file=' + encodeURIComponent(p); }

  // ── 五个区 ────────────────────────────────────────────────
  var HALLS = [
    { k: 'tech',  name: '本事 · 技术地基', color: 0x378ADD, dark: 0x185FA5, css: '#378ADD' },
    { k: 'work',  name: '作品 · 三个项目', color: 0xBA7517, dark: 0x854F0B, css: '#BA7517' },
    { k: 'os',    name: '操作系统 · 行事准则', color: 0x7F77DD, dark: 0x534AB7, css: '#7F77DD' },
    { k: 'field', name: '战场 · 秋招', color: 0x639922, dark: 0x3B6D11, css: '#639922' },
    { k: 'books', name: '书架 · 读过的', color: 0xD85A30, dark: 0x993C1D, css: '#D85A30' }
  ];

  var nodes = [];

  (window.MARVIS_CLUSTERS || []).forEach(function (c) {
    if (c.zone !== '一档' && c.zone !== '二档') return;
    var tot = c.topics.length, got = 0;
    c.topics.forEach(function (t) { if (lvOf(c.id + '/' + t.id) >= MASTER) got++; });
    nodes.push({
      hall: 'tech', id: c.id, name: c.name,
      ratio: tot ? got / tot : 0, got: got, tot: tot,
      desc: c.zone + ' · ' + got + '/' + tot + ' 条主线已到「会了」',
      lines: c.topics.map(function (t) {
        return { n: t.id + ' · ' + t.name, href: t.href, ok: lvOf(c.id + '/' + t.id) >= MASTER };
      })
    });
  });

  var pitch = (window.MARVIS_CLUSTERS || []).filter(function (c) { return c.id === 'pitch'; })[0];
  (window.MARVIS_PROJECTS || []).forEach(function (p) {
    var lines = [], got = 0, tot = 0;
    if (pitch) pitch.topics.forEach(function (t) {
      if (t.proj !== p.name) return;
      tot++;
      var ok = lvOf('pitch/' + t.id) >= MASTER;
      if (ok) got++;
      lines.push({ n: t.name, href: t.href, ok: ok });
    });
    nodes.push({
      hall: 'work', id: p.id, name: p.name, ratio: tot ? got / tot : 0,
      got: got, tot: tot, desc: p.lead, href: p.href, lines: lines
    });
  });

  (window.MARVIS_RULES || []).forEach(function (r) {
    nodes.push({
      hall: 'os', id: r.id, name: r.name, ratio: 0, untrained: true,
      desc: r.action, href: 'rules.html#r-' + r.id
    });
  });

  [
    { n: '秋招破局方案', d: 'offer = 投递量 × 过筛率 × 转化率；两条可观测止损线', f: '../output/秋招破局方案.html', h: true },
    { n: '投递台账 108 家', d: '五层分组 S16 / A28 / B35 / C21 / D8 + 硬窗口日历', f: '../output/秋招投递台账.html', h: true },
    { n: '简历族（母版+3 方向）', d: '事实不变、表达自由；只改母版再派生', f: '../output/resume/刘宇广-AI应用开发-2027届.html', h: true },
    { n: '面试复盘报告', d: '乐元素 · 线上 AI 业务推演的实测评分与缺失模块', f: 'reviews/', h: true },
    { n: '网申开放题作答', d: '逐条最优版本，纯文本可直接粘进表单', f: '../output/网申开放题作答-刘宇广.md', h: false }
  ].forEach(function (r, i) {
    nodes.push({
      hall: 'field', id: 'a' + i, name: r.n, ratio: 0, untrained: true,
      desc: r.d, href: r.h ? r.f : ob(r.f)
    });
  });

  [
    { n: '精确努力·目标篇', d: '目标要少、可判定、放在趋势上；已归口到库内正本对照表', f: 'reading/conclusions/2026-09-25-精确努力目标篇' },
    { n: '心态制胜', d: '行动规则整份的触发来源：自我1离线、自我2当班', f: 'reading/discussions/2026-09-06-心态制胜-discussion' },
    { n: '儒释道·道篇·身体与命功', d: '命功框架的来源：身体是电池，性功是消耗', f: 'reading/notes/2026-09-09-儒释道-道篇-身体与命功' },
    { n: '二十岁困惑与目标制定', d: '二十岁三问；讨论全程留档', f: 'reading/discussions/2026-09-24-二十岁困惑与目标制定-discussion' },
    { n: '能力圈与位置价值', d: '不懂不做、位置决定价值', f: 'reading/notes/2026-09-25-能力圈与位置价值' }
  ].forEach(function (r, i) {
    nodes.push({ hall: 'books', id: 'b' + i, name: r.n, ratio: 0, untrained: true, desc: r.d, href: ob(r.f) });
  });

  /* 掌握度三档（借数字花园的成熟度范式：人眼分不清十档深浅，三段一眼就懂）
     0 = 还没读进去（灰、薄册） · 1 = 正在读（厅色、中等厚） · 2 = 已读透（深色、最厚） */
  function lv3(n) {
    if (n.untrained) return 0;
    if (n.tot) return n.ratio >= 1 ? 2 : (n.ratio > 0 ? 1 : 0);
    return 0;
  }
  var LV_WORD = ['还没读进去', '正在读', '已读透'];

  document.getElementById('legend').innerHTML =
    HALLS.map(function (h) {
      return '<span><span class="k" style="background:' + h.css + '"></span>' + h.name + '</span>';
    }).join('') +
    '<span><span class="k" style="background:#B4B2A9"></span>灰薄册 = 还没读进去</span>' +
    '<span>越厚越实 = 练得越透</span>';

  var techNodes = nodes.filter(function (n) { return n.hall === 'tech' || n.hall === 'work'; });
  var G = 0, T = 0;
  techNodes.forEach(function (n) { G += n.got || 0; T += n.tot || 0; });
  var overall = T ? Math.round(G / T * 100) : 0;

  var bars = document.getElementById('bars');
  HALLS.forEach(function (h) {
    var list = nodes.filter(function (n) { return n.hall === h.k; });
    var trained = list.filter(function (n) { return !n.untrained; });
    var pct = 0;
    if (trained.length) {
      var g = 0, t = 0;
      trained.forEach(function (n) { g += n.got; t += n.tot; });
      pct = t ? Math.round(g / t * 100) : 0;
    }
    var un = list.filter(function (n) { return n.untrained; }).length;
    var d = document.createElement('div');
    d.className = 'bar';
    d.innerHTML = '<small>' + h.name + (un ? ' · ' + un + ' 项未接入派单' : '') + '</small>' +
      '<strong>' + (trained.length ? pct + '%' : '—') + '</strong>' +
      '<div class="track"><i style="width:' + (trained.length ? pct : 0) + '%;background:' + h.css + '"></i></div>';
    bars.appendChild(d);
  });

  var PROFILE = { name: '刘宇广 · 2027 届', who: '南华大学本科 · 求职 AI 应用开发 / Agent 后端', overall: overall };

  function panelCore() {
    var p = document.getElementById('panel');
    var cnt = [0, 0, 0];
    nodes.forEach(function (n) { cnt[lv3(n)]++; });
    p.innerHTML = '<h3>' + PROFILE.name + '</h3>' +
      '<div class="meta">' + PROFILE.who + '</div>' +
      '<div class="meta">已接入派单的部分掌握度 <b>' + overall + '%</b>（' + G + '/' + T + '）</div>' +
      '<div class="meta">这座书架共 ' + nodes.length + ' 本：已读透 <b>' + cnt[2] +
      '</b> · 正在读 <b>' + cnt[1] + '</b> · 还没读进去 <b>' + cnt[0] + '</b></div>' +
      '<div style="margin-top:10px"><a class="mv-btn mv-btn-primary" href="progress.html" style="text-decoration:none">去进度页</a></div>';
    nodes.forEach(function (x) { if (x.label) x.label.classList.remove('hot'); });
  }

  function fallback2D(reason) {
    var st = document.getElementById('stage');
    st.style.height = 'auto';
    st.innerHTML = '<p class="mv-note" style="margin:10px 0 0">已降级为 2D 列表（' +
      reason + '）。内容与下钻完全一样，只是不立体。</p>';
    var fb = document.createElement('div');
    fb.className = 'fallback';
    HALLS.forEach(function (h) {
      var box = document.createElement('div');
      box.className = 'fb-hall';
      box.innerHTML = '<h4>' + h.name + '</h4>';
      nodes.filter(function (n) { return n.hall === h.k; }).forEach(function (n) {
        var a = document.createElement('a');
        var lv = lv3(n);
        a.textContent = (lv === 2 ? '● ' : lv === 1 ? '◐ ' : '○ ') + n.name +
          (n.tot ? '（' + n.got + '/' + n.tot + '）' : '');
        a.href = n.href || 'progress.html';
        box.appendChild(a);
      });
      fb.appendChild(box);
    });
    st.appendChild(fb);
    panelCore();
  }
  if (typeof THREE === 'undefined') { fallback2D('three.js 未加载'); return; }

  // ── 3D：一面书架墙 ────────────────────────────────────────
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('cv');
  var labelBox = document.getElementById('labels');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (e) {
    fallback2D('这台机器/浏览器没有可用的 WebGL');
    return;
  }
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf3efe7);
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);

  scene.add(new THREE.AmbientLight(0xffffff, 0.66));
  var lk = new THREE.DirectionalLight(0xffffff, 0.72);
  lk.position.set(6, 12, 14);
  scene.add(lk);
  var lf = new THREE.DirectionalLight(0xffffff, 0.30);
  lf.position.set(-10, 4, 8);
  scene.add(lf);

  var meshes = [];
  var BOOK_H = 3.0, BOOK_D = 1.5, GAP_B = 0.07, PAD = 0.55;
  var WOOD = 0x7A6650, WOOD_DARK = 0x4E4237, GRAY = 0xB4B2A9;
  function bookW(lv) { return [0.44, 0.66, 0.92][lv]; }

  // 书脊纹理：竖排中文（书脊窄高，竖排最自然）
  function spineTex(text, bg, fg, wpx) {
    var c = document.createElement('canvas');
    c.width = wpx; c.height = 320;
    var g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0, 0, wpx, 320);
    g.fillStyle = fg;
    g.font = '500 40px "Microsoft YaHei","PingFang SC",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var chars = String(text).split('').slice(0, 9);   // 书脊只有 9 个字符位；超长的悬停能看到全名
    var step = 34, startY = 30;
    chars.forEach(function (ch, i) { g.fillText(ch, wpx / 2, startY + i * step); });
    var t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    return t;
  }
  function cssOf(hex, alpha) {
    var r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
    return alpha === undefined ? 'rgb(' + r + ',' + g + ',' + b + ')'
      : 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  // 分组：每厅一组竖排书
  var groups = HALLS.map(function (h) {
    var list = nodes.filter(function (n) { return n.hall === h.k; });
    var w = 0;
    list.forEach(function (n, i) { w += bookW(lv3(n)) + (i ? GAP_B : 0); });
    var avg = 0;
    list.forEach(function (n) { avg += lv3(n); });
    avg = list.length ? avg / list.length : 0;
    return { h: h, list: list, w: w + PAD * 2, avg: avg };
  });

  // 两行布局：第一行 本事+作品，第二行 操作系统+战场+书架（按实际书宽算，不写死）
  var ROWS = [['tech', 'work'], ['os', 'field', 'books']];
  var ROW_GAP = 0.8;
  function rowWidth(ids) {
    var w = 0;
    ids.forEach(function (id, i) {
      var g = groups.filter(function (x) { return x.h.k === id; })[0];
      if (g) w += g.w + (i ? ROW_GAP : 0);
    });
    return w;
  }
  var WALL_W = Math.max(rowWidth(ROWS[0]), rowWidth(ROWS[1]));
  var X0 = -WALL_W / 2;

  var SHELF_Y = [4.5, 0];          // 两行层板的顶面高度
  var TOP_Y = SHELF_Y[0] + BOOK_H + 1.3;   // 顶部铭牌中心

  // 背板
  var board = new THREE.Mesh(
    new THREE.BoxGeometry(WALL_W + 0.5, TOP_Y - SHELF_Y[1] + BOOK_H + 1.0, 0.25),
    new THREE.MeshStandardMaterial({ color: WOOD_DARK, roughness: 0.85 })
  );
  board.position.set(0, (TOP_Y - 1.0 + SHELF_Y[1]) / 2 + 0.2, -BOOK_D / 2 - 0.3);
  scene.add(board);

  groups.forEach(function (grp) {
    var h = grp.h;
    var ri = 0, idx = 0;
    ROWS.forEach(function (ids, r) {
      ids.forEach(function (id, j) {
        if (id === h.k) { ri = r; idx = j; }
      });
    });
    var rowIds = ROWS[ri];
    var gx = -rowWidth(rowIds) / 2;   // 每行各自居中，行内组数和宽度不同也能对住
    for (var j = 0; j < rowIds.length; j++) {
      var g2 = groups.filter(function (x) { return x.h.k === rowIds[j]; })[0];
      if (rowIds[j] === h.k) break;
      gx += g2.w + ROW_GAP;
    }
    var baseY = SHELF_Y[ri];

    // 层板
    var plank = new THREE.Mesh(
      new THREE.BoxGeometry(grp.w, 0.20, BOOK_D + 0.3),
      new THREE.MeshStandardMaterial({ color: WOOD, roughness: 0.75 })
    );
    plank.position.set(gx + grp.w / 2, baseY - 0.10, 0);
    scene.add(plank);

    // 一本书 = 一个条目
    var cx = gx + PAD;
    grp.list.forEach(function (n) {
      var lv = lv3(n);
      var w = bookW(lv);
      /* 未练的书不是死灰：掺 66% 灰的厅色——一眼还能看出它属于哪个区 */
      var col = lv === 0
        ? new THREE.Color(h.color).lerp(new THREE.Color(GRAY), 0.66).getHex()
        : (lv === 1 ? h.color : h.dark);
      var edge = new THREE.MeshStandardMaterial({ color: col, roughness: 0.62, metalness: 0.02 });
      var face = new THREE.MeshStandardMaterial({
        map: spineTex(n.name, cssOf(col), lv === 0 ? '#43433F' : '#FFFFFF',
          lv === 0 ? 56 : (lv === 1 ? 84 : 118)),
        roughness: 0.62, metalness: 0.02
      });
      var book = new THREE.Mesh(
        new THREE.BoxGeometry(w, BOOK_H, BOOK_D),
        [edge, edge, edge, edge, face, edge]
      );
      book.position.set(cx + w / 2, baseY + BOOK_H / 2, 0);
      book.userData.homeZ = 0;
      scene.add(book);
      n.mesh = book;
      meshes.push(book);

      var lb = document.createElement('div');
      lb.className = 'lbl';
      lb.textContent = n.name;
      lb.style.display = 'none';     // 名字在书脊上，标签只在悬停时出
      lb.addEventListener('click', function (e) { e.stopPropagation(); select(n); });
      labelBox.appendChild(lb);
      n.label = lb;

      cx += w + GAP_B;
    });

    // 区名标签
    var hl = document.createElement('div');
    hl.className = 'lbl hall-lbl';
    hl.innerHTML = '<b>' + h.name + '</b><i>' + grp.list.length + ' 本</i>';
    labelBox.appendChild(hl);
    h.label = hl;
    h.anchor = new THREE.Vector3(gx + grp.w / 2, baseY + BOOK_H + 0.55, 0.6);
  });

  // 顶部铭牌 = 我
  var nameCanvas = document.createElement('canvas');
  nameCanvas.width = 1024; nameCanvas.height = 128;
  (function () {
    var g = nameCanvas.getContext('2d');
    g.fillStyle = cssOf(WOOD); g.fillRect(0, 0, 1024, 128);
    g.fillStyle = '#F5F1E8';
    g.font = '500 30px "Microsoft YaHei","PingFang SC",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(PROFILE.name + ' · AI 应用开发 / Agent 后端 · 整体 ' + overall + '%', 512, 66);
  })();
  var plaque = new THREE.Mesh(
    new THREE.BoxGeometry(Math.min(WALL_W, 12.5), 1.25, 0.3),
    [
      new THREE.MeshStandardMaterial({ color: WOOD }), new THREE.MeshStandardMaterial({ color: WOOD }),
      new THREE.MeshStandardMaterial({ color: WOOD }), new THREE.MeshStandardMaterial({ color: WOOD }),
      new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(nameCanvas), roughness: 0.7 }),
      new THREE.MeshStandardMaterial({ color: WOOD })
    ]
  );
  plaque.position.set(0, TOP_Y, 0);
  scene.add(plaque);
  meshes.push(plaque);

  var coreLbl = document.createElement('div');
  coreLbl.className = 'lbl hall-lbl';
  coreLbl.innerHTML = '<b>我</b><i>整体 ' + overall + '%</i>';
  coreLbl.style.display = 'none';
  coreLbl.addEventListener('click', function (e) { e.stopPropagation(); panelCore(); });
  labelBox.appendChild(coreLbl);
  var coreAnchor = new THREE.Vector3(0, TOP_Y, 0.8);

  function select(n) {
    var p = document.getElementById('panel');
    var lv = lv3(n);
    var html = '<h3>' + n.name + '</h3><div class="meta">' + (n.desc || '') + '</div>';
    html += '<div class="meta">状态：<b>' + LV_WORD[lv] + '</b>' +
      (n.untrained ? '（有正本，但没接进派单，所以没有复训数据）' : '') + '</div>';
    if (!n.untrained && n.tot) {
      html += '<div class="meta">掌握度 ' + Math.round(n.ratio * 100) + '%（' + n.got + '/' + n.tot + '）</div>';
    }
    if (n.lines && n.lines.length) {
      html += '<ul>' + n.lines.map(function (l) {
        return '<li>' + (l.ok ? '● ' : '◌ ') +
          '<a href="' + l.href + '" style="color:#185FA5;text-decoration:none">' + l.n + '</a></li>';
      }).join('') + '</ul>';
    }
    if (n.href) {
      html += '<div style="margin-top:10px"><a class="mv-btn mv-btn-primary" href="' + n.href +
        '" style="text-decoration:none">打开</a></div>';
    }
    p.innerHTML = html;
    nodes.forEach(function (x) { if (x.label) x.label.classList.toggle('hot', x === n); });
  }

  // ── 相机：正面平视，只允许小幅左右转 ──────────────────────
  var theta = 0, phi = 1.40, dist = 20.5;
  var drag = false, px = 0, py = 0;
  stage.addEventListener('mousedown', function (e) {
    drag = true; px = e.clientX; py = e.clientY; stage.classList.add('dragging');
  });
  window.addEventListener('mouseup', function () { drag = false; stage.classList.remove('dragging'); });
  window.addEventListener('mousemove', function (e) {
    if (!drag) return;
    theta -= (e.clientX - px) * 0.004;
    theta = Math.max(-0.46, Math.min(0.46, theta));   // ±26°：能看侧面，不会转到迷路
    phi -= (e.clientY - py) * 0.003;
    phi = Math.max(1.18, Math.min(1.52, phi));
    px = e.clientX; py = e.clientY;
  });
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    dist = Math.max(7, Math.min(34, dist + e.deltaY * 0.014));
  }, { passive: false });

  var raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
  function pick(e) {
    var r = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    return raycaster.intersectObjects(meshes, false)[0];
  }
  stage.addEventListener('click', function (e) {
    var hit = pick(e);
    if (!hit) return;
    if (hit.object === plaque) { panelCore(); return; }
    var n = nodes.filter(function (x) { return x.mesh === hit.object; })[0];
    if (n) select(n);
  });

  var hovered = null;
  stage.addEventListener('mousemove', function (e) {
    if (drag) return;
    var hit = pick(e);
    var n = hit ? nodes.filter(function (x) { return x.mesh === hit.object; })[0] : null;
    if (n !== hovered) {
      if (hovered && hovered.mesh) hovered.mesh.position.z = hovered.mesh.userData.homeZ || 0;
      if (n && n.mesh) n.mesh.position.z = 0.55;      // 抽出来一点，像从架上取下
      hovered = n;
    }
    nodes.forEach(function (x) { if (x.label) x.label.classList.toggle('hot', x === n); });
    stage.style.cursor = (hit || n) ? 'pointer' : '';
  });

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var v = new THREE.Vector3();
  function place(lb, vec) {
    v.copy(vec).project(camera);
    var w = stage.clientWidth, h = stage.clientHeight;
    lb.style.left = ((v.x * 0.5 + 0.5) * w) + 'px';
    lb.style.top = ((-v.y * 0.5 + 0.5) * h) + 'px';
    if (v.z <= 1) lb.style.visibility = 'visible';
  }

  panelCore();

  (function loop() {
    requestAnimationFrame(loop);
    camera.position.set(
      dist * Math.sin(phi) * Math.sin(theta),
      dist * Math.cos(phi),
      dist * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(0, 4.2, 0);   // 对准整面墙的中部（含顶部铭牌），否则铭牌会被裁掉
    renderer.render(scene, camera);

    HALLS.forEach(function (h) { if (h.label) place(h.label, h.anchor); });
    place(coreLbl, coreAnchor);
    if (hovered && hovered.label) place(hovered.label, hovered.mesh.position.clone().add(new THREE.Vector3(0, BOOK_H / 2 + 0.45, 0.6)));
  })();

  window.MARVIS_BRAIN = { nodes: nodes, overall: overall };
})();
</script>
</body>
</html>
