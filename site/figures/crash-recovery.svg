<svg viewBox="0 0 680 282" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>崩溃恢复的四个步骤</title>
<desc>从 check point 起重放 redo（按页 LSN 跳过已落盘的），用 binlog 完整性裁决 prepare 事务，最后用 undo 回滚未提交的事务。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="28" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">重启后的恢复：四步</text>
<rect x="40" y="44" width="600" height="42" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="58" y="65" font-family="system-ui,sans-serif" font-size="12" fill="#2C2C2A" dominant-baseline="central">崩溃瞬间，每个事务只可能是三种状态：未提交 ／ 已提交 ／ 提交到一半（prepare）</text>
<rect x="40" y="102" width="138" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="109" y="124" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">① 定位起点</text>
<text x="109" y="146" font-family="system-ui,sans-serif" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">从最近一次</text>
<text x="109" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">check point 开始</text>
<rect x="194" y="102" width="138" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="263" y="124" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">② redo 重放</text>
<text x="263" y="146" font-family="system-ui,sans-serif" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">比较页 LSN</text>
<text x="263" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">已落盘的跳过</text>
<rect x="348" y="102" width="138" height="76" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="417" y="124" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">③ 裁决 prepare</text>
<text x="417" y="146" font-family="system-ui,sans-serif" font-size="12" fill="#412402" text-anchor="middle" dominant-baseline="central">binlog 全 → 提交</text>
<text x="417" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">不全 → 回滚</text>
<rect x="502" y="102" width="138" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="571" y="124" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">④ undo 回滚</text>
<text x="571" y="146" font-family="system-ui,sans-serif" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">未提交的事务</text>
<text x="571" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">反向撤销</text>
<path d="M180 140 L190 140" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M334 140 L344 140" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M488 140 L498 140" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="198" width="600" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="220" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">顺序不能反：先 redo 重放、再 undo 回滚 —— 反过来会在「已提交但数据页未落盘」时把数据回滚掉。</text>
<text x="58" y="242" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">redo 重放是幂等的（按页 LSN 判断是否已做过），所以恢复途中再崩也没关系，重启后继续。</text>
</svg>
