<svg viewBox="0 0 680 366" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>namespace 管视图，cgroup 管额度</title>
<desc>容器共享同一个内核：namespace 决定进程能看到什么，cgroup 决定它能用多少；内存没有 namespace，所以 free 看到的是宿主机。</desc>
<defs>
<marker id="arrowX1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">容器不是小虚拟机：它共享宿主机的内核</text>

<rect x="40" y="46" width="290" height="150" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="56" y="68" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">namespace —— 隔离「看到什么」</text>
<text x="56" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">PID（看不到宿主机别的进程）</text>
<text x="56" y="108" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">NET（自己的网卡与端口空间）</text>
<text x="56" y="126" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">MNT（自己的文件系统视图）· UTS · IPC · USER</text>
<text x="56" y="148" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">★ 没有「内存 namespace」</text>
<text x="56" y="168" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">　 → 所以容器里 free 看到的是【宿主机】的内存</text>
<text x="56" y="186" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">　 → 也看不到别的容器的 CPU 竞争</text>

<rect x="350" y="46" width="290" height="150" rx="10" fill="#F1EEF8" stroke="#7A6FA8" stroke-width="0.5"/>
<text x="366" y="68" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">cgroup —— 限制「能用多少」</text>
<text x="366" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">memory.max / memory.high / memory.current</text>
<text x="366" y="108" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">cpu.max（配额/周期）· cpu.stat 里的 throttled</text>
<text x="366" y="126" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">pids.max（任务数上限）· io.max</text>
<text x="366" y="148" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">超 memory.max → 【cgroup OOM】</text>
<text x="366" y="168" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">超 cpu.max → 【被限流 throttled】</text>
<text x="366" y="186" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">→ 两者都【和宿主机还剩多少资源无关】</text>

<rect x="40" y="212" width="600" height="76" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="58" y="234" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">算一遍：为什么「CPU 利用率 40%」不代表「这里还很闲」</text>
<text x="58" y="256" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">容器配额 0.5 核（cpu.max = 50000 100000）；单个请求要 60 ms CPU；每秒来 20 个请求</text>
<text x="58" y="276" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">需要 20 × 60 ms = 1.2 秒 CPU/秒 = 1.2 核 &gt; 0.5 核 → 超出 140% → 大量请求被限流</text>

<rect x="40" y="304" width="600" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="324" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">被限流的表现很迷惑：CPU 看着不高、但延迟抖动、P99 抬升，而且【换个空闲的宿主机就好了】</text>
<text x="58" y="344" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">判断动作：看 cpu.stat 的 nr_throttled 与 throttled_usec —— 有没有在涨，才是决定性证据</text>
</svg>
