<svg viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>长事务的两条危害路径：一条走 MVCC，一条走锁</title>
  <desc>长事务同时按住两样东西。按住 ReadView 的那条走 MVCC：purge 不敢清理它还可能要读的旧版本，于是 undo 膨胀、版本链变长，后果是快照读回溯变慢、回滚成本更高。按住锁的那条走写路径：写锁一直持到事务结束，其他写事务排队，死锁概率上升。关键差别是只读事务——它触发不了右边那条，但左边那条照样走。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">长事务的两条危害路径：一条走 MVCC，一条走锁</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">「长事务危险」不是一个原因，是两条独立的链——而只读事务只会触发其中一条</text>

  <!-- 中心 -->
  <rect x="30" y="88" width="150" height="66" rx="8" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="105" y="112" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#633806" text-anchor="middle">长事务</text>
  <text x="105" y="130" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">ReadView 不释放</text>
  <text x="105" y="145" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">锁也不释放</text>

  <!-- 左上分支：MVCC -->
  <path d="M180 105 L246 105" stroke="#BA7517" stroke-width="1.4" fill="none" marker-end="url(#lt-ar)"/>
  <text x="213" y="98" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">走 MVCC</text>

  <rect x="250" y="82" width="150" height="46" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="325" y="101" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A" text-anchor="middle">purge 不敢清理</text>
  <text x="325" y="118" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">链上它之前的旧版本都留着</text>

  <path d="M400 105 L446 105" stroke="#BA7517" stroke-width="1.4" fill="none" marker-end="url(#lt-ar)"/>

  <rect x="450" y="70" width="200" height="70" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="466" y="89" font-family="system-ui,sans-serif" font-size="10" fill="#633806">· 快照读沿链回溯变慢（读）</text>
  <text x="466" y="106" font-family="system-ui,sans-serif" font-size="10" fill="#633806">· undo 膨胀、占空间与 IO</text>
  <text x="466" y="123" font-family="system-ui,sans-serif" font-size="10" fill="#633806">· 回滚要撤销的更多</text>

  <!-- 左下分支：锁 -->
  <path d="M180 140 L246 168" stroke="#8A877E" stroke-width="1.4" fill="none" marker-end="url(#lt-ar2)"/>

  <rect x="250" y="150" width="150" height="46" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="325" y="169" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A" text-anchor="middle">写锁持到事务结束</text>
  <text x="325" y="186" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">只有写了才触发这条</text>

  <path d="M400 173 L446 173" stroke="#8A877E" stroke-width="1.4" fill="none" marker-end="url(#lt-ar2)"/>

  <rect x="450" y="146" width="200" height="54" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="466" y="165" font-family="system-ui,sans-serif" font-size="10" fill="#2C2C2A">· 其他写事务排队（写变慢）</text>
  <text x="466" y="182" font-family="system-ui,sans-serif" font-size="10" fill="#2C2C2A">· 死锁概率上升</text>

  <!-- 底部 -->
  <path d="M30 226 L650 226" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>

  <text x="30" y="252" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#2C2C2A">最容易漏的一点：只读事务</text>
  <text x="30" y="272" font-family="system-ui,sans-serif" font-size="10.5" fill="#633806">它<b>触发不了右边那条</b>（没写就没锁），但<b>左边那条照样走</b>——因为它持有 ReadView。</text>
  <text x="30" y="292" font-family="system-ui,sans-serif" font-size="10.5" fill="#6B6A65">最常见的真实形态：<tspan font-family="monospace">SET autocommit = 0;</tspan> 跑了个查询，然后忘了提交——连接挂着，CPU 低、几乎无查询，监控上很不起眼。</text>

  <text x="30" y="320" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A">监控口径：盯最老事务的 <tspan font-family="monospace">trx_started</tspan>——回收边界由最老的 ReadView 决定（PG 侧对应的是最老事务的 <tspan font-family="monospace">xmin</tspan>）。</text>

  <defs>
    <marker id="lt-ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#BA7517"/>
    </marker>
    <marker id="lt-ar2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8A877E"/>
    </marker>
  </defs>
</svg>
