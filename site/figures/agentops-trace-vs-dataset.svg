<svg viewBox="0 0 680 176" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:var(--font-sans)">
<title>Trace 会过期，Dataset 不会</title>
<desc>Trace 在 SaaS 上保留 180 天后永久删除，Dataset 无限期保留；坏例必须在保留期内从前者搬到后者。</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="68" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Trace</text>
<text x="40" y="132" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">Dataset</text>
<rect x="120" y="48" width="380" height="40" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="136" y="68" font-size="12" fill="#791F1F" dominant-baseline="central">保留 180 天</text>
<text x="508" y="68" font-size="12" fill="#A32D2D" dominant-baseline="central">到期永久删除</text>
<rect x="120" y="112" width="500" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="136" y="132" font-size="12" fill="#04342C" dominant-baseline="central">无限期保留（源 trace 已删也保留）</text>
<line x1="622" y1="132" x2="634" y2="132" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow4)"/>
<line x1="200" y1="88" x2="200" y2="108" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow3)"/>
<text x="212" y="98" font-size="12" fill="#5F5E5A" dominant-baseline="central">坏例要在保留期内搬走</text>
</svg>
