<svg viewBox="0 0 680 146" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:var(--font-sans)">
<title>Langfuse 的写入路径：先落地再入库</title>
<desc>SDK 本地缓冲、Web 批量接收、立刻写 S3、Redis 只存引用、Worker 落库到 ClickHouse，共五段。</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="112" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="96" y="62" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">SDK 缓冲</text>
<text x="96" y="82" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">不阻塞请求</text>
<rect x="162" y="40" width="112" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="218" y="62" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Web 接收</text>
<text x="218" y="82" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">批量收下</text>
<rect x="284" y="40" width="112" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="62" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">写 S3</text>
<text x="340" y="82" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">原始事件先落地</text>
<rect x="406" y="40" width="112" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="462" y="62" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Redis</text>
<text x="462" y="82" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">只存一条引用</text>
<rect x="528" y="40" width="112" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="584" y="62" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">ClickHouse</text>
<text x="584" y="82" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Worker 落库</text>
<line x1="155" y1="68" x2="159" y2="68" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="277" y1="68" x2="281" y2="68" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="399" y1="68" x2="403" y2="68" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="521" y1="68" x2="525" y2="68" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="40" y="126" font-size="12" fill="#5F5E5A">官方命名「可恢复性」：队列里不搬大对象（峰值不打库），数据库短暂不可用也不丢事件</text>
</svg>
