<svg viewBox="0 0 680 462" role="img" xmlns="http://www.w3.org/2000/svg">
<title>选型三问：从负载推出引擎族</title>
<desc>第一问看访问模式：点查小事务走向行存数据库，大范围扫描与聚合走向列存；第二问问数据量：千万行以内先别引入新引擎，亿级以上再上专用列存引擎。顺序很重要——前一问能定死答案，后面就不用问了。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">从负载推出引擎族：顺序不能反</text>
<text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">先问访问模式，再问数据量，最后才问引擎——任何一问能定死答案，后面就不用问</text>

<path d="M340 122 L340 144 L130 144 L130 166" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 122 L340 144 L550 144 L550 166" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="240" y="66" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="88" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">第一问：访问模式</text>
<text x="340" y="108" font-family="system-ui,sans-serif" font-size="11.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">点查，还是大范围扫描？</text>

<rect x="40" y="166" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="188" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">点查 / 小事务</text>
<text x="130" y="208" font-family="system-ui,sans-serif" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">要强一致 · 要低延迟</text>

<rect x="460" y="166" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="550" y="188" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#04342C" text-anchor="middle" dominant-baseline="central">大范围扫描与聚合</text>
<text x="550" y="208" font-family="system-ui,sans-serif" font-size="11.5" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">数据量大 · 并发不高</text>

<path d="M130 222 L130 262" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M550 222 L550 262" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M550 322 L550 362" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="266" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="130" y="288" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">行存数据库</text>
<text x="130" y="308" font-family="system-ui,sans-serif" font-size="11.5" fill="#444441" text-anchor="middle" dominant-baseline="central">MySQL / PostgreSQL</text>
<text x="130" y="326" font-family="system-ui,sans-serif" font-size="11.5" fill="#444441" text-anchor="middle" dominant-baseline="central">TiDB · OceanBase</text>

<rect x="460" y="266" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="550" y="288" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">第二问：数据量多大</text>
<text x="550" y="308" font-family="system-ui,sans-serif" font-size="11.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">千万行以内先别加引擎</text>

<rect x="460" y="366" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="550" y="388" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#04342C" text-anchor="middle" dominant-baseline="central">列存分析引擎</text>
<text x="550" y="408" font-family="system-ui,sans-serif" font-size="11.5" fill="#444441" text-anchor="middle" dominant-baseline="central">ClickHouse · Doris</text>
<text x="550" y="426" font-family="system-ui,sans-serif" font-size="11.5" fill="#444441" text-anchor="middle" dominant-baseline="central">StarRocks · DuckDB</text>
</svg>
