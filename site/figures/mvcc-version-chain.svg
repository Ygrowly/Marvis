<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>版本链与 ReadView 的可见性判定</title>
<desc>InnoDB 把旧版本留在 undo log 里，用 roll_pointer 串成链；读取时用 ReadView 逐版本判断可见性。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="344" height="156" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="56" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">undo log 里的版本链</text>
<rect x="56" y="96" width="94" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="103" y="116" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">当前版本</text>
<text x="103" y="134" font-family="ui-monospace,monospace" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">trx_id = 105</text>
<rect x="165" y="96" width="94" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="212" y="116" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">上一个版本</text>
<text x="212" y="134" font-family="ui-monospace,monospace" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">trx_id = 98</text>
<rect x="274" y="96" width="94" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="321" y="116" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">更旧</text>
<text x="321" y="134" font-family="ui-monospace,monospace" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">trx_id = 90</text>
<path d="M152 124 L163 124" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M261 124 L272 124" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="56" y="176" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">每行带 trx_id（谁改的）+ roll_pointer（指向上一个版本）</text>
<rect x="400" y="40" width="240" height="156" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="416" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">ReadView（快照那一刻拍下）</text>
<text x="416" y="92" font-family="ui-monospace,monospace" font-size="12" fill="#2C2C2A" dominant-baseline="central">m_ids = [98, 102]</text>
<text x="416" y="118" font-family="ui-monospace,monospace" font-size="12" fill="#2C2C2A" dominant-baseline="central">min_trx_id = 98</text>
<text x="416" y="144" font-family="ui-monospace,monospace" font-size="12" fill="#2C2C2A" dominant-baseline="central">max_trx_id = 106</text>
<text x="416" y="170" font-family="ui-monospace,monospace" font-size="12" fill="#2C2C2A" dominant-baseline="central">creator_trx_id = 105</text>
<rect x="40" y="216" width="600" height="104" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="240" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">trx_id ＝ 自己 → 可见（自己改的当然看得见）　｜　trx_id ＜ min_trx_id → 可见（快照前已提交）</text>
<text x="58" y="264" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">trx_id ≥ max_trx_id → 不可见（快照之后才开始的事务）</text>
<text x="58" y="288" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">落在 min 与 max 之间：在 m_ids 里 → 当时还没提交 → 不可见，沿 roll_pointer 找更旧版本</text>
<text x="58" y="308" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">不在 m_ids 里 → 当时已提交 → 可见</text>
</svg>
