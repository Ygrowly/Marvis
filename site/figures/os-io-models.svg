<svg viewBox="0 0 680 404" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>五种 IO 模型的两段观与 epoll 的内部结构</title>
<desc>一次 IO 分等就绪与拷贝两段；多路复用只改造第一段。epoll 靠 interest list 与 ready list 把每次调用的工作量从监控总数解耦到就绪数；零拷贝省掉两次 CPU 拷贝。</desc>
<defs>
<marker id="arrow6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">用「两段」这把尺子，五种 IO 模型一次排清</text>

<rect x="40" y="46" width="600" height="146" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="58" y="68" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">一次 IO ＝ 第一段「等就绪」＋ 第二段「拷到用户态」</text>
<text x="58" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">阻塞 IO　　　等 · 等　　　　一个连接一个线程，10000 连接 → 内核侧 250MB＋10000 个调度实体</text>
<text x="58" y="110" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">非阻塞 IO　　不等 · 等　　　要自己反复问 EAGAIN —— 把「等」变成了「一直问」，更费 CPU</text>
<text x="58" y="130" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">多路复用　　等一批 · 等　　select / poll / epoll —— 把【连接数】与【线程数】解耦</text>
<text x="58" y="150" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">信号驱动　　不等 · 等　　　内核发 SIGIO 通知，实际很少用</text>
<text x="58" y="170" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">异步 IO　　　不等 · 不等　　io_uring / POSIX AIO —— 只有它是真正的异步</text>
<text x="58" y="186" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">判据是第二段谁做 → epoll 通知「可读了」之后，read() 仍要等拷贝 ⇒ epoll 属于同步 IO</text>

<rect x="40" y="206" width="336" height="118" rx="10" fill="#F1EEF8" stroke="#7A6FA8" stroke-width="0.5"/>
<text x="56" y="228" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">epoll 省的是什么（不是零拷贝）</text>
<text x="56" y="250" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">interest list：注册要监控的 fd</text>
<text x="56" y="268" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">ready list：其中已就绪的 fd</text>
<text x="56" y="288" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">epoll_ctl 注册时拷一次，之后不再拷</text>
<text x="56" y="306" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">内核用回调填 ready list，epoll_wait 只取就绪的</text>

<rect x="388" y="206" width="252" height="118" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="404" y="228" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">10000 连接、每秒 1000 次唤醒</text>
<text x="404" y="250" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">select：FD_SETSIZE = 1024 → 表示不了</text>
<text x="404" y="270" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">poll：1000 × 10000 ＝ 1000 万次检查/秒</text>
<text x="404" y="290" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">epoll：1000 × 10 ＝ 1 万次/秒</text>
<text x="404" y="310" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">连接涨到 10 万，epoll 仍是 1 万次</text>

<rect x="40" y="336" width="600" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="356" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">零拷贝省掉的是【CPU 拷贝次数】—— DMA 那两次还在，只是不占 CPU：</text>
<text x="58" y="376" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">read+write 4 次（2 CPU）→ sendfile 2 次（0 CPU，数据不进用户态，Kafka）→ mmap+write 3 次（应用能处理数据，RocketMQ）</text>
</svg>
