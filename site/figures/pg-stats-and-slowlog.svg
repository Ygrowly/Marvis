<svg viewBox="0 0 680 456" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>统计信息的三类偏差与定位慢查询的两站路</title>
  <desc>顶部是优化器做估算的三件原料和它写死的独立假设：不同值个数、高频值列表、直方图，三件都是采样得到的近似值，而多个条件被默认当成相互独立。中间是三类偏差与对应的修法：统计过期用分析命令或调低自动分析的阈值，列间相关用扩展统计，条件里带表达式则建表达式索引或改写语句；右侧给出自动分析的触发算式，八千万行的表要改八百万行才触发。底部是定位慢查询的两站路：先按总耗时排序找出最贵的语句，再对那一条看执行计划，并给出按总耗时排序和按单次耗时排序会得出相反结论的算式。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">统计信息的三类偏差与定位慢查询的两站路</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">优化器不是在猜，它是在拿你给的统计信息算代价——所以「计划不对」先问信息对不对</text>

  <!-- 估算原料 -->
  <rect x="30" y="66" width="300" height="112" rx="8" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="46" y="88" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#2C2C2A">优化器拿什么估算（三件原料）</text>
  <text x="46" y="108" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">n_distinct：不同值大约多少个</text>
  <text x="46" y="126" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">MCV：出现频率最高的若干值（兜住倾斜）</text>
  <text x="46" y="144" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">直方图：其余值的分布（默认 100 个桶）</text>
  <text x="46" y="166" font-family="system-ui,sans-serif" font-size="9.5" fill="#8A3A28">全部来自【随机采样】——更新过也总是近似的</text>

  <rect x="350" y="66" width="300" height="112" rx="8" fill="#FBEEEA" stroke="#E6C4BA"/>
  <text x="366" y="88" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#8A3A28">一个写死的假设：条件之间相互独立</text>
  <text x="366" y="108" font-family="system-ui,sans-serif" font-size="9.5" fill="#8A3A28">优化器把多个条件的选择率【相乘】</text>
  <text x="366" y="126" font-family="monospace,sans-serif" font-size="9.5" fill="#8A3A28">(1/300) × (1/6000) = 1/1,800,000</text>
  <text x="366" y="144" font-family="system-ui,sans-serif" font-size="9.5" fill="#8A3A28">真实：海淀必然在北京 → 1/6000</text>
  <text x="366" y="164" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#8A3A28">→ 低估 300 倍（官方口径：低估结果行数）</text>

  <!-- 三类偏差 -->
  <path d="M30 196 L650 196" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="220" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">三类偏差 · 三种修法</text>

  <rect x="30" y="232" width="196" height="86" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="44" y="252" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2C2C2A">① 统计信息过期</text>
  <text x="44" y="270" font-family="system-ui,sans-serif" font-size="9" fill="#6B6A65">刚批量导入 / 批量删除后</text>
  <text x="44" y="288" font-family="system-ui,sans-serif" font-size="9" fill="#633806">修：ANALYZE 该表；</text>
  <text x="44" y="304" font-family="system-ui,sans-serif" font-size="9" fill="#633806">或调低 autovacuum 的 analyze 阈值</text>

  <rect x="242" y="232" width="196" height="86" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="256" y="252" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2C2C2A">② 列间相关</text>
  <text x="256" y="270" font-family="system-ui,sans-serif" font-size="9" fill="#6B6A65">单列都准，一乘就错</text>
  <text x="256" y="288" font-family="system-ui,sans-serif" font-size="9" fill="#633806">修：CREATE STATISTICS</text>
  <text x="256" y="304" font-family="system-ui,sans-serif" font-size="9" fill="#633806">dependencies / ndistinct / mcv</text>

  <rect x="454" y="232" width="196" height="86" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="468" y="252" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2C2C2A">③ 表达式 / 函数</text>
  <text x="468" y="270" font-family="system-ui,sans-serif" font-size="9" fill="#6B6A65">lower(x) / date(x) 无法用列统计估</text>
  <text x="468" y="288" font-family="system-ui,sans-serif" font-size="9" fill="#633806">修：表达式索引，或改写 SQL 去掉函数</text>
  <text x="468" y="304" font-family="system-ui,sans-serif" font-size="9" fill="#633806">（CREATE STATISTICS 也有单表达式形式）</text>

  <!-- 阈值算式 -->
  <rect x="30" y="330" width="620" height="54" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="46" y="350" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#633806">为什么大表 auto-analyze 总是慢半拍：阈值 = 50 + 10% × 表行数</text>
  <text x="46" y="370" font-family="monospace,sans-serif" font-size="9.5" fill="#633806">8000 万行 → 50 + 0.1 × 8000 万 = 800 万行才触发 ｜ 写 500 TPS → 800 万 ÷ 500 ≈ 4.4 小时</text>

  <!-- 两站定位 -->
  <path d="M30 398 L650 398" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="420" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">定位慢查询：先按【总耗时】排序，再看单条</text>
  <text x="30" y="442" font-family="monospace,sans-serif" font-size="9.5" fill="#6B6A65">A：单次 2000ms × 每小时 1 次 = 2 秒/小时　　B：单次 20ms × 每秒 300 次 = 21600 秒/小时</text>
</svg>
