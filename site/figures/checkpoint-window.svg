<svg viewBox="0 0 680 348" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Checkpoint 的位置：夹在 intent 与 result 之间的那个不确定窗口</title>
  <desc>一次有副作用的步骤要记两次：调用之前记下 intent（打算做什么、用哪个幂等键），调用之后记下结果（做成了没有、真实返回是什么）。这两次之间是一个不确定窗口——进程可能正好在这里崩掉，此时系统只知道「打算做」但不知道「做成没有」。恢复时正是靠这个窗口的存在，才知道必须去查权威状态而不是盲目重试。右侧是状态实体与它们的关系：Thread 装 Run，Run 装 Step，Step 关联 Artifact 与 Event，Checkpoint 是可恢复的快照。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Checkpoint 的位置：夹在 intent 与 result 之间的那个不确定窗口</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">只记结果，崩溃在中间时不知道「本来要做什么」；只记意图，恢复时不知道「做成没有」</text>

  <!-- 时间轴 -->
  <path d="M30 96 L650 96" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="84" font-family="system-ui,sans-serif" font-size="10.5" fill="#6B6A65">时间 →</text>

  <circle cx="120" cy="96" r="5" fill="#BA7517"/>
  <text x="120" y="76" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">① 记 intent</text>
  <text x="120" y="116" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">打算做什么 + 幂等键</text>

  <rect x="176" y="88" width="248" height="16" rx="4" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="300" y="126" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">② 调用外部工具（可能超时 / 中途被杀）</text>

  <circle cx="480" cy="96" r="5" fill="#BA7517"/>
  <text x="480" y="76" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">③ 记 result</text>
  <text x="480" y="116" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">做成了没有 + 真实返回</text>

  <path d="M180 104 L424 104" stroke="#BA7517" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <text x="300" y="152" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#633806" text-anchor="middle">↑ 不确定窗口：在这一段里崩溃，系统不知道副作用到底发生了没有</text>
  <text x="300" y="168" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65" text-anchor="middle">恢复时必须【查权威状态】，而不是赌一次重试</text>

  <!-- 状态实体 -->
  <path d="M30 192 L650 192" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="216" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">状态实体：谁装谁</text>

  <rect x="30" y="228" width="140" height="52" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="100" y="250" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Thread</text>
  <text x="100" y="268" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">会话 / 长期容器</text>

  <rect x="188" y="228" width="140" height="52" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="258" y="250" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Run</text>
  <text x="258" y="268" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">一次目标执行</text>

  <rect x="346" y="228" width="140" height="52" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="416" y="250" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">Step</text>
  <text x="416" y="268" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">一次模型或工具动作</text>

  <rect x="504" y="228" width="146" height="52" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="577" y="250" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#633806" text-anchor="middle">Checkpoint</text>
  <text x="577" y="268" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">可恢复的状态快照</text>

  <text x="172" y="258" font-family="system-ui,sans-serif" font-size="12" fill="#8A877E">⊃</text>
  <text x="330" y="258" font-family="system-ui,sans-serif" font-size="12" fill="#8A877E">⊃</text>
  <text x="488" y="258" font-family="system-ui,sans-serif" font-size="12" fill="#8A877E">↔</text>

  <text x="30" y="302" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A">另外三张表：<tspan font-family="monospace">Artifact</tspan>（大产物，存 URI + hash + ACL）、<tspan font-family="monospace">Event</tspan>（流式与审计事实，带递增 sequence）、<tspan font-family="monospace">Branch</tspan>（平行探索 / 用户回退）</text>
  <text x="30" y="322" font-family="system-ui,sans-serif" font-size="10.5" fill="#633806">铁律：<tspan font-weight="600">不要只存最终聊天文本</tspan>——否则无法 Replay，也无法把失败定位到具体某个 Step。</text>
  <text x="30" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">持久化分两层：<tspan font-family="monospace">Checkpointer</tspan> 管单 thread 的短期状态；<tspan font-family="monospace">Store</tspan> 管跨 thread 的长期记忆——两者混在一起会让快照变重、失效判断变复杂。</text>
</svg>
