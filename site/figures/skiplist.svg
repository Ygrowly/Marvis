<svg viewBox="0 0 680 270" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>跳表的结构与一次查询路径</title>
<desc>跳表给有序链表加了多层稀疏索引，查询从最高层开始，能往右就往右、不能就下降一层。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="28" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">跳表 ＝ 有序链表 ＋ 多层稀疏索引</text>
<path d="M90 70 L486 70" stroke="#888780" stroke-width="0.5" fill="none"/>
<rect x="90" y="56" width="36" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<rect x="270" y="56" width="36" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<rect x="450" y="56" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="502" y="70" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">索引层（每 4 个取 1）</text>
<path d="M90 110 L486 110" stroke="#888780" stroke-width="0.5" fill="none"/>
<rect x="90" y="96" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="180" y="96" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="270" y="96" width="36" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<rect x="360" y="96" width="36" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<rect x="450" y="96" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="502" y="110" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">索引层（每 2 个取 1）</text>
<path d="M90 150 L486 150" stroke="#888780" stroke-width="0.5" fill="none"/>
<rect x="90" y="136" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="135" y="136" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="180" y="136" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="225" y="136" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="270" y="136" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="315" y="136" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="360" y="136" width="36" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<rect x="405" y="136" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="450" y="136" width="36" height="28" rx="6" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="502" y="150" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">数据层（全量链表）</text>
<path d="M126 70 L264 70" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M288 84 L288 94" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M306 110 L354 110" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M378 124 L378 134" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="378" y="176" font-family="system-ui,sans-serif" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">找到目标</text>
<rect x="40" y="186" width="600" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="208" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">查询从最高层开始：能往右就往右，不能就往下一层 —— 比较次数从 O(n) 降到期望 O(log n)。</text>
<text x="58" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">每层是否出现是随机的（约 1/2 概率向上），所以不需要重平衡 —— 这是它比平衡树简单的根本原因。</text>
</svg>
