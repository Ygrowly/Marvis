<svg viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>多 Agent：什么时候值得，以及 effort 该怎么分档</title>
  <desc>上面是 orchestrator-worker 结构：主 agent 规划后并行派出若干子 agent，每个子 agent 在自己的干净上下文里探索，只把浓缩后的结论回传，主 agent 合成后再决定是否继续。中间是 effort 分档：简单事实查找只要一个 agent 三到十次工具调用，直接对比要二到四个子 agent，复杂研究才需要十个以上。底部是代价：多 agent 的 token 消耗是普通对话的十五倍，所以只有在任务价值足够高时才划算。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">多 Agent：什么时候值得，以及 effort 该怎么分档</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">它有效的原因不是「多个模型更聪明」，是「多了几倍 token 与并行度」</text>

  <!-- 结构 -->
  <text x="30" y="78" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#6B6A65">orchestrator-worker</text>

  <rect x="30" y="88" width="120" height="44" rx="7" fill="#BA7517"/>
  <text x="90" y="108" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lead Agent</text>
  <text x="90" y="124" font-family="system-ui,sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="middle">规划 + 分解 + 合成</text>

  <path d="M152 100 L186 92" stroke="#8A877E" stroke-width="1.3" fill="none" marker-end="url(#ma-ar)"/>
  <path d="M152 110 L186 110" stroke="#8A877E" stroke-width="1.3" fill="none" marker-end="url(#ma-ar)"/>
  <path d="M152 120 L186 128" stroke="#8A877E" stroke-width="1.3" fill="none" marker-end="url(#ma-ar)"/>

  <rect x="190" y="76" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="265" y="95" font-family="system-ui,sans-serif" font-size="9.5" fill="#2C2C2A" text-anchor="middle">子 agent A（干净上下文）</text>
  <rect x="190" y="112" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="265" y="131" font-family="system-ui,sans-serif" font-size="9.5" fill="#2C2C2A" text-anchor="middle">子 agent B</text>
  <rect x="190" y="148" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="265" y="167" font-family="system-ui,sans-serif" font-size="9.5" fill="#2C2C2A" text-anchor="middle">子 agent C</text>

  <path d="M342 91 L376 104" stroke="#BA7517" stroke-width="1.3" fill="none" marker-end="url(#ma-ar2)"/>
  <path d="M342 127 L376 114" stroke="#BA7517" stroke-width="1.3" fill="none" marker-end="url(#ma-ar2)"/>
  <text x="359" y="146" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">只回传</text>
  <text x="359" y="160" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">1–2K 结论</text>

  <rect x="380" y="88" width="130" height="44" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="445" y="108" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">合成 / 判断</text>
  <text x="445" y="124" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">是否还需要下一轮</text>

  <rect x="524" y="88" width="126" height="44" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="587" y="108" font-family="system-ui,sans-serif" font-size="10" fill="#2C2C2A" text-anchor="middle">探索过程的噪声</text>
  <text x="587" y="124" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">留在子 agent 里</text>

  <!-- effort 分档 -->
  <path d="M30 196 L650 196" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="220" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">effort 必须分档（不分档的失败模式：简单查询也派 50 个）</text>

  <rect x="30" y="232" width="196" height="52" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="46" y="252" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">简单事实查找</text>
  <text x="46" y="272" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">1 个 agent · 3–10 次工具调用</text>

  <rect x="242" y="232" width="196" height="52" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="258" y="252" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">直接对比</text>
  <text x="258" y="272" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">2–4 个子 agent · 各 10–15 次</text>

  <rect x="454" y="232" width="196" height="52" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="470" y="252" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#633806">复杂研究</text>
  <text x="470" y="272" font-family="system-ui,sans-serif" font-size="10" fill="#633806">&gt;10 个子 agent，职责分开</text>

  <!-- 底部 -->
  <path d="M30 300 L650 300" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="322" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A">代价：普通对话 = 1×，<tspan font-weight="600">单 agent ≈ 4×，多 agent ≈ 15×</tspan>。而 token 用量单独就解释了 80% 的性能差异——</text>
  <text x="30" y="340" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A">所以它本质上是<tspan font-weight="600">「用钱买性能」</tspan>：只有任务价值足够高、且任务本身能并行拆开时，这笔账才算得过来。</text>

  <defs>
    <marker id="ma-ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A877E"/></marker>
    <marker id="ma-ar2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#BA7517"/></marker>
  </defs>
</svg>
