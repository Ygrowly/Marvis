<svg viewBox="0 0 680 260" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:var(--font-sans)">
<title>AgentOps 平台的四段管道</title>
<desc>采集、Trace 树、Score、Dataset 四段依次相连，下方标注两家独立收敛到同一套结构。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="30" width="132" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="106" y="52" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">采集</text>
<text x="106" y="72" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">SDK · OTel · 非阻塞</text>
<rect x="194" y="30" width="132" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="52" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Trace 树</text>
<text x="260" y="72" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">observation / run</text>
<rect x="348" y="30" width="132" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="414" y="52" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Score</text>
<text x="414" y="72" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">挂到某个节点上</text>
<rect x="502" y="30" width="132" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="568" y="52" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Dataset</text>
<text x="568" y="72" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">可复现的回归集</text>
<line x1="176" y1="58" x2="190" y2="58" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="58" x2="344" y2="58" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="484" y1="58" x2="498" y2="58" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="106" y="102" font-size="12" fill="#888780" text-anchor="middle">平台自带</text>
<text x="260" y="102" font-size="12" fill="#888780" text-anchor="middle">E2 证据层</text>
<text x="414" y="102" font-size="12" fill="#888780" text-anchor="middle">E1 判定层</text>
<text x="568" y="102" font-size="12" fill="#888780" text-anchor="middle">E1 · E3 沉淀层</text>
<rect x="40" y="126" width="594" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="337" y="148" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">两家独立收敛到同一套形状：observation / run → trace → session / thread，且都建在 OpenTelemetry 之上</text>
<text x="40" y="196" font-size="13" font-weight="500" fill="#2C2C2A">平台买的是这条管道，不是"更漂亮的日志"</text>
<line x1="40" y1="210" x2="640" y2="210" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="40" y="232" font-size="12" fill="#5F5E5A">管道不等于结论：结构要自己设计，真值要自己确认，保留期从第一天就在倒计时</text>
<text x="40" y="250" font-size="12" fill="#5F5E5A">自建要付的：队列 + 列存 + 事务库 + 对象存储，以及它们之间的一致性</text>
</svg>
