<svg viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>为什么需要重排：双塔算得快但不够准，交叉编码器准但贵</title>
  <desc>上面是两阶段漏斗：召回阶段要从全量里捞出尽可能不遗漏的候选，宁多勿缺；重排阶段只对这几十上百个候选做精细判断，宁准勿多。下面是两种模型的差别：双塔把查询和文档分别编码成向量再算相似度，文档向量可以预先算好、所以快，但两者编码时从未见过对方，交互信息丢失；交叉编码器把查询和文档拼在一起送进模型，能建模词级交互、因此准得多，但每个候选都要现算一次，无法预计算。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">为什么需要重排：双塔算得快但不够准，交叉编码器准但贵</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">召回要「不漏」，精排要「排得准」——两个阶段的优化目标本来就不一样</text>

  <!-- 漏斗 -->
  <rect x="30" y="66" width="240" height="52" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="46" y="86" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#2C2C2A">① 召回（ANN + BM25 + RRF）</text>
  <text x="46" y="104" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">全量 → 数百条候选，宁多勿缺</text>

  <path d="M272 92 L306 92" stroke="#8A877E" stroke-width="1.4" fill="none" marker-end="url(#rk-ar)"/>

  <rect x="310" y="66" width="240" height="52" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="326" y="86" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#633806">② 重排（Cross-Encoder）</text>
  <text x="326" y="104" font-family="system-ui,sans-serif" font-size="10" fill="#633806">数百条 → 前 5～20 条，宁准勿多</text>

  <path d="M552 92 L586 92" stroke="#8A877E" stroke-width="1.4" fill="none" marker-end="url(#rk-ar)"/>
  <rect x="590" y="66" width="60" height="52" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="620" y="88" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65" text-anchor="middle">进上下文</text>
  <text x="620" y="104" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65" text-anchor="middle">组装</text>

  <!-- 双塔 vs 交叉 -->
  <path d="M30 140 L650 140" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>

  <rect x="30" y="154" width="300" height="112" rx="8" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="46" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">双塔（Bi-Encoder）：用于召回</text>
  <text x="46" y="198" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">query → 编码器 → 向量 Q</text>
  <text x="46" y="215" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">doc　 → 编码器 → 向量 D　（可预计算）</text>
  <text x="46" y="234" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">相似度 = cos(Q, D)</text>
  <text x="46" y="254" font-family="system-ui,sans-serif" font-size="10" fill="#633806">代价：两者编码时没见过对方 → 无词级交互</text>

  <rect x="350" y="154" width="300" height="112" rx="8" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="366" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#633806">交叉编码器（Cross-Encoder）：用于重排</text>
  <text x="366" y="198" font-family="system-ui,sans-serif" font-size="10" fill="#633806">[query + doc] 拼在一起 → 模型 → 一个分数</text>
  <text x="366" y="218" font-family="system-ui,sans-serif" font-size="10" fill="#633806">能看到每个词和每个词的交互</text>
  <text x="366" y="238" font-family="system-ui,sans-serif" font-size="10" fill="#633806">代价：每个候选都要现算一次，无法预计算</text>
  <text x="366" y="258" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">所以只能对「已经缩小过的候选集」用</text>

  <!-- 底部 -->
  <path d="M30 282 L650 282" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="306" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A">所以流程天然是两级的：<tspan font-weight="600">用便宜的双塔把候选从全量缩到几百条，再用贵的交叉编码器把几百条排成几十条。</tspan></text>
  <text x="30" y="326" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">重排的延迟 ≈ 候选数 × 单个候选的耗时——所以「重排多少条」是一个必须算的成本决策，不是越大越好。</text>

  <defs>
    <marker id="rk-ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8A877E"/>
    </marker>
  </defs>
</svg>
