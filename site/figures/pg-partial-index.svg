<svg viewBox="0 0 680 344" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>部分索引：只给热子集建索引，体积与服务范围成正比</title>
  <desc>上面是全表索引与部分索引的对比：表里百分之九十九是终态行，全表索引要为所有行维护索引项，而部分索引只索引活跃态那一小部分，体积相差约一百倍，而且终态化那一步更新完全不碰它。中间是谓词匹配的三条判据：查询条件必须能被证明蕴含在谓词的集合里。底部是表达式索引，它把计算结果当作索引键，但有两个硬约束——函数必须确定性，且查询要写一模一样的表达式。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">部分索引：只给热子集建索引，体积与服务范围成正比</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">只用得上 1% 的行，就不该为 100% 的行付维护成本——但这份便宜有代价：它会静默失效</text>

  <!-- 对比 -->
  <rect x="30" y="66" width="300" height="96" rx="8" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="46" y="88" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#2C2C2A">✗ 全表索引：为 100% 的行维护</text>
  <text x="46" y="110" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">99% 终态行永远用不上，却一直占空间</text>
  <text x="46" y="128" font-family="system-ui,sans-serif" font-size="10" fill="#633806">每次「终态化」的更新都要维护它</text>
  <text x="46" y="146" font-family="system-ui,sans-serif" font-size="10" fill="#633806">VACUUM 要清理的索引页也更多</text>

  <rect x="350" y="66" width="300" height="96" rx="8" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="366" y="88" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#633806">✓ 部分索引：只为活跃行维护</text>
  <text x="366" y="110" font-family="system-ui,sans-serif" font-size="10" fill="#633806">体积与服务范围成正比（本例约为全量的 1/100）</text>
  <text x="366" y="128" font-family="system-ui,sans-serif" font-size="10" fill="#633806">终态化那一步【完全不碰这个索引】</text>
  <text x="366" y="146" font-family="system-ui,sans-serif" font-size="10" fill="#633806">VACUUM 负担同步下降</text>

  <!-- 谓词匹配 -->
  <path d="M30 180 L650 180" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="204" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">谓词匹配：查询条件必须能被【证明蕴含】在索引谓词里</text>
  <text x="30" y="226" font-family="monospace,sans-serif" font-size="9.5" fill="#6B6A65">索引：WHERE status IN ('QUEUED','RUNNING','WAITING_APPROVAL')</text>

  <rect x="30" y="238" width="196" height="46" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="46" y="258" font-family="system-ui,sans-serif" font-size="10" fill="#2C2C2A">WHERE status = 'RUNNING'</text>
  <text x="46" y="276" font-family="system-ui,sans-serif" font-size="10" fill="#633806">✓ 蕴含在 IN 里 → 能用</text>

  <rect x="242" y="238" width="196" height="46" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="258" y="258" font-family="system-ui,sans-serif" font-size="10" fill="#2C2C2A">WHERE status = 'COMPLETED'</text>
  <text x="258" y="276" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">✗ 不在子集里</text>

  <rect x="454" y="238" width="196" height="46" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="470" y="258" font-family="system-ui,sans-serif" font-size="10" fill="#633806">WHERE updated_at &gt; ?（不带 status）</text>
  <text x="470" y="276" font-family="system-ui,sans-serif" font-size="10" fill="#633806">✗ 谓词缺失 → 无法证明蕴含</text>

  <!-- 底部 -->
  <path d="M30 300 L650 300" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="322" font-family="system-ui,sans-serif" font-size="10.5" fill="#633806">最大的运维风险：<tspan font-weight="600">静默失效</tspan>——以后新增一条「查终态任务」的需求，新查询自动用不上、走全表扫，而你不会收到任何通知。</text>
  <text x="30" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">所以部分索引必须配一句「它的服务范围是什么」写进注释或文档——这是它和普通索引最大的不同。</text>
</svg>
