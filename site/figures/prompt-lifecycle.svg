<svg viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>一条指令的生命周期：为什么会从「拐杖」变成「冲突」</title>
  <desc>上半部分是一条指令的完整生命周期：先为了补某个失败模式写下来，进入系统提示或 CLAUDE.md，随着模型升级那个失败模式消失，指令从补偿变成约束甚至和其他指令冲突，最后必须靠消融实验决定删除还是保留。下半部分列出六类最典型的历史拐杖，以及一次实测的消融结果：清掉这些拐杖后成本下降 14.6%、准确率上升 5.3%。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">一条指令的生命周期：为什么会从「拐杖」变成「冲突」</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">指令是写给「当时的模型」的——模型变了，指令的收益和代价都会变，所以必须靠消融验证，不能凭感觉</text>

  <!-- 生命周期链条 -->
  <text x="30" y="76" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">① 一条指令的五个阶段</text>

  <rect x="30" y="88" width="116" height="58" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="88" y="110" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">写下指令</text>
  <text x="88" y="127" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">补某个失败模式</text>
  <text x="88" y="140" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">（当时是有效的）</text>

  <path d="M148 117 L164 117" stroke="#8A877E" stroke-width="1.3" fill="none" marker-end="url(#pv-ar)"/>

  <rect x="166" y="88" width="116" height="58" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="224" y="110" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">沉淀下来</text>
  <text x="224" y="127" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">进入系统提示 /</text>
  <text x="224" y="140" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">CLAUDE.md / Skills</text>

  <path d="M284 117 L300 117" stroke="#8A877E" stroke-width="1.3" fill="none" marker-end="url(#pv-ar)"/>

  <rect x="302" y="88" width="116" height="58" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="360" y="110" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle">模型升级</text>
  <text x="360" y="127" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">它补的那个弱点</text>
  <text x="360" y="140" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65" text-anchor="middle">消失了</text>

  <path d="M420 117 L436 117" stroke="#BA7517" stroke-width="1.3" fill="none" marker-end="url(#pv-ar2)"/>

  <rect x="438" y="88" width="116" height="58" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="496" y="110" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#633806" text-anchor="middle">变成负担</text>
  <text x="496" y="127" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">只在少数场景成立，</text>
  <text x="496" y="140" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">还和别的指令打架</text>

  <path d="M556 117 L572 117" stroke="#BA7517" stroke-width="1.3" fill="none" marker-end="url(#pv-ar2)"/>

  <rect x="574" y="88" width="76" height="58" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="612" y="110" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#633806" text-anchor="middle">消融判定</text>
  <text x="612" y="127" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">删一段</text>
  <text x="612" y="140" font-family="system-ui,sans-serif" font-size="9.5" fill="#633806" text-anchor="middle">比同一套 Eval</text>

  <path d="M612 146 L612 166 L88 166 L88 148" stroke="#BA7517" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#pv-ar2)"/>
  <text x="350" y="180" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">指标没掉 → 删掉；指标变好 → 这就是一条"拐杖"；指标变差 → 保留，并记下它现在在补偿什么</text>

  <!-- 六类拐杖 -->
  <text x="30" y="212" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">② 最典型的六类历史拐杖</text>

  <rect x="30" y="224" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#E3E1DA"/>
  <text x="44" y="244" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">验证仪式</text>
  <text x="44" y="262" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">"再检查一遍" → 被字面执行，重复查</text>

  <rect x="242" y="224" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#E3E1DA"/>
  <text x="256" y="244" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">强调型助推</text>
  <text x="256" y="262" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">"务必极其详尽" → 变成冗长与多余检索</text>

  <rect x="454" y="224" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#E3E1DA"/>
  <text x="468" y="244" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">强制流程与草稿纸</text>
  <text x="468" y="262" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">"一步步写在草稿里" → 与原生思考冲突</text>

  <rect x="30" y="286" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#E3E1DA"/>
  <text x="44" y="306" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">过时示例</text>
  <text x="44" y="324" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">针对旧模型失败模式写的 few-shot</text>

  <rect x="242" y="286" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#E3E1DA"/>
  <text x="256" y="306" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">互相矛盾的规则</text>
  <text x="256" y="324" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">"按政策退款" vs "不得擅自退款"</text>

  <rect x="454" y="286" width="196" height="52" rx="7" fill="#FFFFFF" stroke="#E3E1DA"/>
  <text x="468" y="306" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">过期的配置</text>
  <text x="468" y="324" font-family="system-ui,sans-serif" font-size="9.5" fill="#6B6A65">为上一代模型手写的思考预算等参数</text>

  <text x="30" y="362" font-family="system-ui,sans-serif" font-size="10.5" fill="#633806">实测：清掉这些拐杖后，成本降 14.6%、准确率升 5.3% —— 拐杖不只是浪费 token，它会真的把答案带偏。</text>

  <defs>
    <marker id="pv-ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8A877E"/>
    </marker>
    <marker id="pv-ar2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#BA7517"/>
    </marker>
  </defs>
</svg>
