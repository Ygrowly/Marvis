<svg viewBox="0 0 680 288" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>两阶段提交的三步与两个崩溃点</title>
<desc>两阶段提交把 redo 与 binlog 捆成原子操作；无论崩在哪一步，裁决依据都是 binlog 是否完整。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="28" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">两阶段提交：三步 与 两个崩溃点</text>
<rect x="56" y="52" width="168" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="140" y="76" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">① redo 置 prepare</text>
<rect x="256" y="52" width="168" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="76" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">② binlog 落盘</text>
<rect x="456" y="52" width="168" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="540" y="76" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">③ redo 置 commit</text>
<path d="M226 76 L252 76" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M426 76 L452 76" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="239" y="112" font-family="system-ui,sans-serif" font-size="12" fill="#501313" text-anchor="middle" dominant-baseline="central">✕ 崩在这</text>
<text x="439" y="112" font-family="system-ui,sans-serif" font-size="12" fill="#501313" text-anchor="middle" dominant-baseline="central">✕ 崩在这</text>
<rect x="56" y="128" width="284" height="80" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="74" y="148" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">若崩在 ① 与 ② 之间</text>
<text x="74" y="170" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">binlog 不完整 → 回滚</text>
<text x="74" y="190" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">主库、从库都没有这次更新</text>
<rect x="340" y="128" width="284" height="80" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="358" y="148" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">若崩在 ② 与 ③ 之间</text>
<text x="358" y="170" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">binlog 完整 → 提交</text>
<text x="358" y="190" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">主库、从库都有这次更新</text>
<rect x="56" y="224" width="568" height="44" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="74" y="246" font-family="system-ui,sans-serif" font-size="12" fill="#2C2C2A" dominant-baseline="central">裁决依据只有一件事：binlog 是否完整 —— 这就是两阶段提交存在的全部理由。</text>
</svg>
