<svg viewBox="0 0 680 356" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>线上变慢的排查顺序：先分类，再看数</title>
<desc>先用症状把范围缩到一类资源，再用压力与能力把原因分成两半；负载高但 CPU 不高是等 IO 的签名。</desc>
<defs>
<marker id="arrowX3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">排查 = 先缩范围，再看数；顺序比命令重要</text>

<rect x="40" y="46" width="600" height="66" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="68" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#412402" dominant-baseline="central">第 0 步：先归因到「一层」，别一头钻进某个指标</text>
<text x="58" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">是全部接口慢，还是某个接口慢？是所有实例慢，还是单实例慢？——这两个问题能把范围缩掉八成的可能性</text>

<rect x="40" y="126" width="290" height="130" rx="10" fill="#F1EEF8" stroke="#7A6FA8" stroke-width="0.5"/>
<text x="56" y="148" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">两个二分问题，把原因分成四块</text>
<text x="56" y="172" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">① 是「压力」还是「能力」？</text>
<text x="56" y="190" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">　 压力 = 来得太多；能力 = 干得太慢</text>
<text x="56" y="214" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">② 是「在等」还是「在算」？</text>
<text x="56" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">　 在等 → 改异步/优化下游；在算 → 加核/改算法</text>

<rect x="350" y="126" width="290" height="130" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="366" y="148" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">四类症状的第一眼</text>
<text x="366" y="172" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">CPU 高 → 在算：看谁在烧（perf / 火焰图）</text>
<text x="366" y="190" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">内存紧 → 看 RSS 与 PSI，区分泄漏/上界</text>
<text x="366" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">磁盘 → 先看 %util 与 await，再看空间</text>
<text x="366" y="226" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">网络 → 连接数 · 重传 · 带宽 · 下游延迟</text>

<rect x="40" y="270" width="600" height="72" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="58" y="292" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">三个最容易误判的信号</text>
<text x="58" y="312" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">① load 高但 CPU 不高 → 大量任务在不可中断等待（多为磁盘 IO），不是 CPU 不够</text>
<text x="58" y="330" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">② CPU 利用率不高但延迟抖动 → 可能是被 cgroup 限流（看 cpu.stat 的 throttled）</text>
<text x="58" y="346" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">③ free 显示内存用满 → 先看 available，页缓存是可回收的</text>
</svg>
