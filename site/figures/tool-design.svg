<svg viewBox="0 0 680 344" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>工具设计：把 API endpoint 直接包一层，是把检索工作推给了模型</title>
  <desc>左边是常见的错误做法：把 list_contacts 这样的 API 直接包装成工具，一次返回全部联系人，模型只能逐个读过去，用有限的上下文做暴力搜索。右边是正确做法：按 agent 的高频工作流设计工具（search_contacts、schedule_event），把多步操作合进一次调用。底部是同一个响应两种写法的 token 对比：详细版 206 token、精简版 72 token，后者只用三分之一。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">工具设计：把 API endpoint 直接包一层，是把检索工作推给了模型</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">「工具越多越好」是常见的错——更多工具往往带来更差的结果</text>

  <!-- 左：错误做法 -->
  <rect x="30" y="66" width="300" height="150" rx="8" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="46" y="88" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">✗ 包装 API：list_contacts</text>
  <text x="46" y="110" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">一次返回全部联系人</text>
  <text x="46" y="130" font-family="system-ui,sans-serif" font-size="10" fill="#633806">→ 模型只能一个一个读过去</text>
  <text x="46" y="148" font-family="system-ui,sans-serif" font-size="10" fill="#633806">→ 拿有限的上下文做【暴力搜索】</text>
  <text x="46" y="172" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">人也不会这么找通讯录——</text>
  <text x="46" y="188" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">你会直接翻到的那一页，而不是从头读</text>
  <text x="46" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#633806">agent 的 affordance 和传统软件不同</text>

  <!-- 右：正确做法 -->
  <rect x="350" y="66" width="300" height="150" rx="8" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="366" y="88" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#633806">✓ 按工作流设计：consolidation</text>
  <text x="366" y="110" font-family="system-ui,sans-serif" font-size="10" fill="#633806">list_users + list_events + create_event</text>
  <text x="366" y="126" font-family="system-ui,sans-serif" font-size="10" fill="#633806">　→ 合成一个 <tspan font-family="monospace">schedule_event</tspan></text>
  <text x="366" y="146" font-family="system-ui,sans-serif" font-size="10" fill="#633806">read_logs → <tspan font-family="monospace">search_logs</tspan>（只返回相关行 + 上下文）</text>
  <text x="366" y="162" font-family="system-ui,sans-serif" font-size="10" fill="#633806">get_customer_by_id + list_transactions + list_notes</text>
  <text x="366" y="178" font-family="system-ui,sans-serif" font-size="10" fill="#633806">　→ 合成一个 <tspan font-family="monospace">get_customer_context</tspan></text>
  <text x="366" y="200" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">把中间产物消耗的上下文，</text>
  <text x="366" y="214" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">从 agent 的上下文里搬回工具内部</text>

  <!-- 底部 -->
  <path d="M30 236 L650 236" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="260" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#2C2C2A">同一个响应的两种写法</text>

  <rect x="30" y="272" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="46" y="292" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A">详细版：含 thread_ts / channel_id / user_id</text>
  <text x="46" y="312" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#633806">206 token　← 能继续发起后续调用</text>

  <rect x="350" y="272" width="300" height="52" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="366" y="292" font-family="system-ui,sans-serif" font-size="10.5" fill="#633806">精简版：只有内容，不带 ID</text>
  <text x="366" y="312" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#633806">72 token　← 约三分之一</text>

  <text x="30" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">所以「该返回什么」不是一个格式问题，是「模型接下来还需不需要用它发起调用」的问题。</text>
</svg>
