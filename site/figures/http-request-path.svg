<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>502 503 504 各自发生在链路的哪一段</title>
<desc>请求链路上，502 是网关收到了上游的无效响应，504 是网关等上游超时，503 是应用自己回绝。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="30" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">一次请求穿过的四段：哪一段出问题，决定你看到哪个 5xx</text>
<rect x="40" y="56" width="132" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="106" y="82" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">客户端</text>
<rect x="196" y="56" width="132" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="262" y="76" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">网关 / 负载均衡</text>
<text x="262" y="94" font-family="system-ui,sans-serif" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">超时与重试在这层</text>
<rect x="352" y="56" width="132" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="418" y="82" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">应用</text>
<rect x="508" y="56" width="132" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="574" y="76" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">上游 / 数据库</text>
<text x="574" y="94" font-family="system-ui,sans-serif" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">慢在这里会变 504</text>
<path d="M174 82 L192 82" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M330 82 L348 82" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M486 82 L504 82" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="140" width="188" height="96" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="162" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#412402" dominant-baseline="central">502 Bad Gateway</text>
<text x="58" y="186" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">上游「活着但答得不对」</text>
<text x="58" y="210" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">连接被重置 / 响应解析不了</text>
<text x="58" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">＝ 答非所问</text>
<rect x="246" y="140" width="188" height="96" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="264" y="162" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#412402" dominant-baseline="central">503 Service Unavailable</text>
<text x="264" y="186" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">应用「主动承认不行」</text>
<text x="264" y="210" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">过载、维护中、依赖全挂</text>
<text x="264" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">可配 Retry-After</text>
<rect x="452" y="140" width="188" height="96" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="470" y="162" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#412402" dominant-baseline="central">504 Gateway Timeout</text>
<text x="470" y="186" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">网关「等上游等到超时」</text>
<text x="470" y="210" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">上游太慢或没响应</text>
<text x="470" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">＝ 根本没答</text>
<rect x="40" y="252" width="600" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="58" y="276" font-family="system-ui,sans-serif" font-size="12" fill="#2C2C2A" dominant-baseline="central">一句话：502 是答非所问，504 是根本没答，503 是自己承认不行。三者都指向不同的排查起点。</text>
</svg>
