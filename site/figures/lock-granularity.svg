<svg viewBox="0 0 680 372" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>锁的粒度、冲突率与记账开销，以及分段锁的算术</title>
<desc>粒度越大冲突率越高但记账越便宜；分段把单段冲突率降到约 1 除以段数，但热键救不了。</desc>
<defs>
<marker id="arrowL2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">粒度不是在「性能」和「开销」之间选，是在「冲突率」和「记账」之间选</text>

<rect x="40" y="46" width="290" height="128" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="56" y="68" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">粒度大（一把大锁 / 表锁）</text>
<text x="56" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">冲突率高：任何两个请求都可能撞上</text>
<text x="56" y="110" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">记账便宜：锁对象少</text>
<text x="56" y="130" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">风险：排队等待、阻塞别人</text>
<text x="56" y="152" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">适合：临界区极短、访问集中</text>

<rect x="350" y="46" width="290" height="128" rx="10" fill="#F1EEF8" stroke="#7A6FA8" stroke-width="0.5"/>
<text x="366" y="68" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">粒度小（行锁 / 分段锁）</text>
<text x="366" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">冲突率低：只锁真正竞争的那一小块</text>
<text x="366" y="110" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">记账贵：锁对象多、内存与 cache 占用</text>
<text x="366" y="130" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">风险：跨段事务 → 循环等待 → 死锁</text>
<text x="366" y="152" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">前提：访问均匀分散、一次只碰一段</text>

<rect x="40" y="190" width="600" height="96" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="58" y="212" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">分段锁的算术：期望尝试次数 = 1 ÷ (1 − 冲突率)</text>
<text x="58" y="234" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">单锁：p = 40% → 1 ÷ 0.6 = 1.67 次（多干 67% 的活）</text>
<text x="58" y="254" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">分 16 段（均匀）：单段 p ≈ 40% ÷ 16 = 2.5% → 1.026 次（多干 2.6%）</text>
<text x="58" y="274" font-family="system-ui,sans-serif" font-size="11" fill="#8A3B2A" dominant-baseline="central">但热键承担 50% 访问量时：它落到的那一段照样被打爆，其余 15 段闲着</text>

<rect x="40" y="302" width="600" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="322" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">热键的三条正解（都不是「更好的锁」）：本地聚合 · 队列串行 · 每节点累加器（无共享）</text>
<text x="58" y="342" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">更根本的一句：减少竞争，永远优先于更好地处理竞争（EnergyOps 的「受控并发」就是这个思路）</text>
</svg>
