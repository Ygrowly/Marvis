<svg viewBox="0 0 680 336" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>进程 线程 协程的三种并发模型</title>
<desc>进程地址空间独立、线程共享地址空间但由操作系统调度、协程由用户态事件循环调度。线程栈是虚拟预留，真正常驻的是内核侧约 25KB。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="28" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">同一个指标下比较：单位开销、谁调度、共享什么</text>
<rect x="40" y="44" width="188" height="190" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="58" y="66" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">进程</text>
<text x="58" y="92" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">地址空间：独立</text>
<text x="58" y="116" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">调度者：操作系统</text>
<text x="58" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">成本：切换跨页表</text>
<text x="58" y="164" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">优点：隔离最好</text>
<text x="58" y="188" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">代价：通信与切换最贵</text>
<rect x="246" y="44" width="188" height="190" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="264" y="66" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">线程</text>
<text x="264" y="92" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">地址空间：共享</text>
<text x="264" y="116" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">调度者：操作系统</text>
<text x="264" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">成本：内核侧约 25KB</text>
<text x="264" y="164" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">优点：共享数据方便</text>
<text x="264" y="188" font-family="system-ui,sans-serif" font-size="12" fill="#444441" dominant-baseline="central">代价：切换要走内核</text>
<rect x="452" y="44" width="188" height="190" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="470" y="66" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#412402" dominant-baseline="central">协程</text>
<text x="470" y="92" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">地址空间：共享</text>
<text x="470" y="116" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">调度者：用户态事件循环</text>
<text x="470" y="140" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">成本：约 2KB</text>
<text x="470" y="164" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">优点：切换几乎免费</text>
<text x="470" y="188" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">代价：一处阻塞全体停摆</text>
<rect x="40" y="250" width="600" height="70" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="270" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">线程的真实开销（最容易被讲错的一项）：用户栈默认 8MB 是【虚拟预留、按需提交】</text>
<text x="58" y="289" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">（Linux 上由 ulimit -s 决定，x86-32 才是 2MB）；常驻的只有内核侧约 25KB/线程</text>
<text x="58" y="308" font-family="system-ui,sans-serif" font-size="12" fill="#412402" dominant-baseline="central">（16KB 内核栈 + task_struct），且不计入 RSS。协程连这部分也省掉 —— 差别不在「1MB 还是 2KB」</text>
</svg>
