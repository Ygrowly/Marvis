<svg viewBox="0 0 680 456" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>同一句范围查询在 B 树与 B+ 树上的路径对比</title>
<desc>B 树的数据分布在所有层，中序遍历要在层间上下跳；B+ 树数据全在叶子层且叶子用链表相连，下降到起点后沿链表向右扫，不再回到上层。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="28" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#633806" dominant-baseline="central">B 树：数据分布在所有层</text>
<rect x="270" y="38" width="140" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="52" font-family="system-ui,sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">键 + 数据</text>
<rect x="160" y="82" width="120" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="220" y="96" font-family="system-ui,sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">键 + 数据</text>
<rect x="400" y="82" width="120" height="28" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="460" y="96" font-family="system-ui,sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">键 + 数据</text>
<path d="M320 66L230 82" fill="none" stroke="#BA7517" stroke-width="0.5"/>
<path d="M360 66L450 82" fill="none" stroke="#BA7517" stroke-width="0.5"/>
<path d="M200 110L155 126" fill="none" stroke="#BA7517" stroke-width="0.5"/>
<path d="M240 110L285 126" fill="none" stroke="#BA7517" stroke-width="0.5"/>
<path d="M440 110L435 126" fill="none" stroke="#BA7517" stroke-width="0.5"/>
<path d="M480 110L565 126" fill="none" stroke="#BA7517" stroke-width="0.5"/>
<rect x="100" y="126" width="90" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="145" y="139" font-family="system-ui,sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">数据</text>
<rect x="250" y="126" width="90" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="295" y="139" font-family="system-ui,sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">数据</text>
<rect x="380" y="126" width="90" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="425" y="139" font-family="system-ui,sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">数据</text>
<rect x="530" y="126" width="90" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="575" y="139" font-family="system-ui,sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">数据</text>

<text x="40" y="181" font-family="system-ui,sans-serif" font-size="12" fill="var(--color-text-secondary)" dominant-baseline="central">取一段区间的路径：</text>
<rect x="60" y="168" width="96" height="26" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="108" y="181" font-family="system-ui,sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">根 L1</text>
<path d="M157 181L175 181" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="176" y="168" width="96" height="26" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="224" y="181" font-family="system-ui,sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">中 L2</text>
<path d="M273 181L291 181" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="292" y="168" width="96" height="26" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="181" font-family="system-ui,sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">根 L1</text>
<path d="M389 181L407 181" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="408" y="168" width="96" height="26" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="456" y="181" font-family="system-ui,sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">中 L2</text>
<path d="M505 181L523 181" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="524" y="168" width="96" height="26" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="572" y="181" font-family="system-ui,sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">叶 L3</text>
<text x="40" y="216" font-family="system-ui,sans-serif" font-size="12" fill="#633806" dominant-baseline="central">层级忽上忽下，每一次上下都可能落在新的页上，就是一次新 IO</text>

<text x="40" y="258" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">B+ 树：数据只在叶子层，叶子之间用双向链表相连</text>
<rect x="270" y="268" width="140" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="282" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">只有键</text>
<rect x="160" y="312" width="120" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="326" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">只有键</text>
<rect x="400" y="312" width="120" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="460" y="326" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">只有键</text>
<path d="M320 296L230 312" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
<path d="M360 296L450 312" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
<path d="M200 340L155 356" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
<path d="M240 340L285 356" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
<path d="M440 340L435 356" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
<path d="M480 340L565 356" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="100" y="356" width="90" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="369" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">数据</text>
<rect x="250" y="356" width="90" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="295" y="369" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">数据</text>
<rect x="380" y="356" width="90" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="425" y="369" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">数据</text>
<rect x="530" y="356" width="90" height="26" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="575" y="369" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">数据</text>
<path d="M192 369L248 369" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M342 369L378 369" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M472 369L528 369" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<text x="40" y="405" font-family="system-ui,sans-serif" font-size="12" fill="var(--color-text-secondary)" dominant-baseline="central">取一段区间的路径：</text>
<rect x="60" y="392" width="96" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="108" y="405" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">根 L1</text>
<path d="M157 405L175 405" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="176" y="392" width="96" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="224" y="405" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">中 L2</text>
<path d="M273 405L291 405" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="292" y="392" width="96" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="405" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">叶 L3</text>
<path d="M389 405L407 405" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="408" y="392" width="96" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="456" y="405" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">叶 L3</text>
<path d="M505 405L523 405" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="524" y="392" width="96" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="572" y="405" font-family="system-ui,sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">叶 L3</text>
<text x="40" y="440" font-family="system-ui,sans-serif" font-size="12" fill="#085041" dominant-baseline="central">下降到起点只一次，之后一直向右扫，层级只降不升——不会回到根重新下降</text>
</svg>
