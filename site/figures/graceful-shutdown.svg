<svg viewBox="0 0 680 292" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>优雅退出的四步与时间窗</title>
<desc>先摘流量、再等排空、然后关依赖、最后退出；时间窗等于摘流量生效加最长在途加清理，必须小于平台宽限期。</desc>
<defs>
<marker id="arrowX2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">优雅退出：四步顺序不能乱</text>

<rect x="40" y="46" width="140" height="72" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="56" y="70" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#412402" dominant-baseline="central">① 摘流量</text>
<text x="56" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">从 LB / 注册中心摘掉</text>
<text x="56" y="106" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">★ 最容易漏的一步</text>

<line x1="184" y1="82" x2="200" y2="82" stroke="#888780" stroke-width="1" marker-end="url(#arrowX2)"/>

<rect x="204" y="46" width="140" height="72" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="220" y="70" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">② 等在途完成</text>
<text x="220" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">设一个最长等待</text>
<text x="220" y="106" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">这才是「优雅」的本体</text>

<line x1="348" y1="82" x2="364" y2="82" stroke="#888780" stroke-width="1" marker-end="url(#arrowX2)"/>

<rect x="368" y="46" width="140" height="72" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="384" y="70" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">③ 关依赖</text>
<text x="384" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">连接池 · 事务 · 缓冲</text>
<text x="384" y="106" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">必须在 ② 之后</text>

<line x1="512" y1="82" x2="528" y2="82" stroke="#888780" stroke-width="1" marker-end="url(#arrowX2)"/>

<rect x="532" y="46" width="108" height="72" rx="10" fill="#F1EEF8" stroke="#7A6FA8" stroke-width="0.5"/>
<text x="548" y="70" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">④ 主动退出</text>
<text x="548" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">比被 SIGKILL 好</text>
<text x="548" y="106" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">能控制退出码</text>

<rect x="40" y="134" width="600" height="70" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="58" y="156" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">时间窗要算，而且必须小于平台宽限期</text>
<text x="58" y="178" font-family="system-ui,sans-serif" font-size="11" fill="#444441" dominant-baseline="central">时间窗 &gt; 摘流量生效(约 1 s) + 最长在途请求(P99.9 800ms) + 清理(200ms) ≈ 2 s</text>
<text x="58" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#633806" dominant-baseline="central">平台流程：发 SIGTERM（可捕获）→ 等宽限期 → 发 SIGKILL（不可捕获）→ 必须留安全边界</text>

<rect x="40" y="220" width="600" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="58" y="240" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">长任务（导出跑 60 s）绝不能进这个窗口：收到信号 → 写 checkpoint → 主动结束该任务</text>
<text x="58" y="260" font-family="system-ui,sans-serif" font-size="11" fill="#412402" dominant-baseline="central">恢复时从 checkpoint 继续；已产生副作用要靠幂等键避免重复 —— 可中断 + 可恢复</text>
</svg>
