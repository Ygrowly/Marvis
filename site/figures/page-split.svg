<svg viewBox="0 0 680 358" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>页分裂：自增主键与随机主键把同一份数据装成两种样子</title>
  <desc>上半部分对比两种插入方式。自增主键的新行永远追加到最右页，页满了就在右边开新页，老页保持接近全满；随机主键的新行落在任意位置，命中已满的页时要把该页一分为二，两页各剩约一半空间。下半部分算出结果：同样的五千万行，顺序插入约 312 万页，随机插入因填充率降到约一半而占约 625 万页——文件翻倍，缓存能装下的页数减半。</desc>

  <text x="30" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">页分裂：自增主键与随机主键把同一份数据装成两种样子</text>
  <text x="30" y="46" font-family="system-ui,sans-serif" font-size="11.5" fill="#6B6A65">B+ 树的叶子按主键有序——「新行插在哪」直接决定「同样的数据占多少页」</text>

  <!-- 上：自增 -->
  <text x="30" y="82" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">① 自增主键：新行追加到最右</text>

  <rect x="46" y="94" width="70" height="34" rx="4" fill="#BA7517" fill-opacity="0.85"/>
  <rect x="122" y="94" width="70" height="34" rx="4" fill="#BA7517" fill-opacity="0.9"/>
  <rect x="198" y="94" width="70" height="34" rx="4" fill="#BA7517"/>
  <rect x="274" y="94" width="70" height="34" rx="4" fill="#BA7517" fill-opacity="0.35"/>

  <text x="81" y="116" font-family="system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">满</text>
  <text x="157" y="116" font-family="system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">满</text>
  <text x="233" y="116" font-family="system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">满</text>
  <text x="309" y="116" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">在写</text>

  <path d="M348 111 L382 111" stroke="#8A877E" stroke-width="1.3" fill="none" marker-end="url(#ps-ar)"/>
  <rect x="386" y="94" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#D8D5CC"/>
  <text x="421" y="116" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65" text-anchor="middle">新页</text>

  <text x="472" y="110" font-family="system-ui,sans-serif" font-size="10.5" fill="#6B6A65">页满 → 右边开新页，</text>
  <text x="472" y="126" font-family="system-ui,sans-serif" font-size="10.5" fill="#6B6A65">老页保持接近全满</text>

  <!-- 下：随机 -->
  <text x="30" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">② 随机主键：新行可能落到任意页</text>

  <rect x="46" y="188" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#D8D5CC"/>
  <rect x="46" y="222" width="70" height="0" fill="none"/>
  <rect x="46" y="188" width="70" height="17" rx="4" fill="#BA7517" fill-opacity="0.4"/>
  <rect x="122" y="188" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#D8D5CC"/>
  <rect x="122" y="188" width="70" height="17" rx="4" fill="#BA7517" fill-opacity="0.4"/>
  <rect x="198" y="188" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#D8D5CC"/>
  <rect x="198" y="188" width="70" height="17" rx="4" fill="#BA7517" fill-opacity="0.4"/>
  <rect x="274" y="188" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#D8D5CC"/>
  <rect x="274" y="188" width="70" height="17" rx="4" fill="#BA7517" fill-opacity="0.4"/>

  <text x="81" y="234" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">半满</text>
  <text x="157" y="234" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">半满</text>
  <text x="233" y="234" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">半满</text>
  <text x="309" y="234" font-family="system-ui,sans-serif" font-size="10" fill="#633806" text-anchor="middle">半满</text>

  <text x="370" y="204" font-family="system-ui,sans-serif" font-size="10.5" fill="#6B6A65">命中已满的页 → 一分为二 →</text>
  <text x="370" y="220" font-family="system-ui,sans-serif" font-size="10.5" fill="#6B6A65">两页各剩约一半空间</text>

  <!-- 结果 -->
  <path d="M30 262 L650 262" stroke="#D8D5CC" stroke-width="1.2" fill="none"/>
  <text x="30" y="286" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A">结果（5000 万行 · 行宽 1KB · 页 16KB）</text>

  <rect x="30" y="298" width="300" height="46" rx="7" fill="#FBF1E2" stroke="#E8D3AF"/>
  <text x="46" y="318" font-family="system-ui,sans-serif" font-size="10.5" fill="#633806">自增：填充率≈100% → 约 312 万页</text>
  <text x="46" y="335" font-family="system-ui,sans-serif" font-size="10" fill="#633806">5000万 × 1KB ÷ 16KB = 312.5 万页</text>

  <rect x="350" y="298" width="300" height="46" rx="7" fill="#F7F6F3" stroke="#E3E1DA"/>
  <text x="366" y="318" font-family="system-ui,sans-serif" font-size="10.5" fill="#2C2C2A">随机：填充率≈50% → 约 625 万页</text>
  <text x="366" y="335" font-family="system-ui,sans-serif" font-size="10" fill="#6B6A65">5000万 × 1KB ÷ 8KB = 625 万页（文件翻倍）</text>

  <defs>
    <marker id="ps-ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8A877E"/>
    </marker>
  </defs>
</svg>
